<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>みんなのへや</title>
<meta name="apple-mobile-web-app-title" content="みんなのへや">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="theme-color" content="#fbf3f5">
<style>
:root{--bg:#fbf3f5;--panel:#ffffff;--ink:#2b2326;--sub:#8a7c81;--line:#eadfe2;--me:#f6c6d4;--them:#ffffff;--accent:#c4577a;--err:#b3261e;--soft:#f4e7eb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#161214;--panel:#211b1e;--ink:#f1e8eb;--sub:#a3959a;--line:#3a2f33;--me:#6b3446;--them:#2a2226;--accent:#e58aa7;--err:#ff8a80;--soft:#2c2427}}
:root[data-theme="dark"]{--bg:#161214;--panel:#211b1e;--ink:#f1e8eb;--sub:#a3959a;--line:#3a2f33;--me:#6b3446;--them:#2a2226;--accent:#e58aa7;--err:#ff8a80;--soft:#2c2427}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Hiragino Sans",sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{font-size:11px;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
#today{font-size:12px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 14px}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button:disabled{opacity:.45}
#log{flex:1;overflow-y:auto;padding:12px 12px 16px;display:flex;flex-direction:column;gap:2px;-webkit-overflow-scrolling:touch}
.msg{display:flex;gap:8px;align-items:flex-start;margin-top:10px}
.msg.cont{margin-top:4px}
.av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;letter-spacing:-.5px;box-shadow:0 0 0 2px var(--panel)}
.msg.cont .av{visibility:hidden;height:0}
.col{display:flex;flex-direction:column;min-width:0;max-width:78%}
.nm{font-size:12px;font-weight:600;color:var(--c);margin:0 0 3px 4px}
.line{display:flex;align-items:flex-end;gap:6px}
.b{padding:9px 12px;border-radius:18px;white-space:pre-wrap;word-break:break-word;line-height:1.55;font-size:15px;background:var(--them);border:1px solid color-mix(in srgb,var(--c) 30%,var(--line));min-width:0}
.msg.them .b{border-top-left-radius:6px}
.msg.cont .b{border-top-left-radius:18px}
.msg.me{justify-content:flex-end}
.msg.me .col{align-items:flex-end}
.msg.me .b{background:var(--me);border-color:transparent;border-top-right-radius:6px}
.tm{flex:none;font-size:10px;color:var(--sub);line-height:1.3;white-space:nowrap;font-variant-numeric:tabular-nums}
.msg.me .tm{text-align:right}
.note{align-self:center;margin:10px 0 0;font-size:12px;color:var(--sub);background:var(--soft);border-radius:999px;padding:4px 12px;text-align:center;white-space:pre-wrap}
.note.err{color:var(--err)}
footer{padding:6px 12px calc(8px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:6px}
.tools{display:flex;align-items:center;gap:8px}
.tools button{font-size:13px;padding:5px 12px}
.inrow{display:flex;gap:8px;align-items:flex-end}
#in{flex:1;resize:none;height:44px;max-height:120px;border-radius:22px;padding:10px 14px}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
#set{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:5}
#set.on{display:flex}
#set .top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#set .top h2{flex:1;font-size:16px;margin:0}
#set .body{flex:1;overflow-y:auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
#set .body>*{flex:none}
#set h3{font-size:13px;margin:14px 0 0;color:var(--accent)}
#set label{font-size:13px;color:var(--sub)}
#set .hint{font-size:12px;color:var(--sub);margin:-4px 0 0}
#set textarea.paper{height:150px;font-size:14px;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row label{display:flex;align-items:center;gap:6px;color:var(--ink)!important;font-size:15px!important}
.mrow{display:grid;grid-template-columns:5.5em 1fr;gap:6px 8px;align-items:center}
.mrow span{font-size:13px;font-weight:600;color:var(--c)}
.mrow .pr{grid-column:2;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--sub)}
.mrow .pr input{width:5.5em;font-size:14px;padding:4px 6px}
details{border:1px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--panel)}
details summary{font-size:14px;color:var(--sub)}
button.danger{color:var(--err);border-color:var(--err)}
.typing .b{color:var(--sub);font-size:14px}
.dots i{font-style:normal;display:inline-block;animation:hop 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:none;opacity:.5}30%{transform:translateY(-3px);opacity:1}}
</style>
</head>
<body>
<header><h1>みんなのへや<small id="testchip" hidden>試し</small></h1><span id="today"></span><button id="gear">設定</button></header>
<div id="log"></div>
<footer>
  <div class="tools"><button id="more">もっと喋らせる</button></div>
  <div class="inrow"><textarea id="in" placeholder="みんなに話す"></textarea><button class="main" id="send">送る</button></div>
</footer>
<div id="set">
  <div class="top"><h2>設定</h2><button id="close">閉じる</button><button class="main" id="save">保存</button></div>
  <div class="body">
    <label>わたしの名前</label>
    <input id="s-name" type="text" autocomplete="off">
    <div class="row"><label><input id="s-test" type="checkbox"> 試しモード（本物のAIを呼ばない・鍵がなくても動く）</label></div>

    <h3>鍵（このiPhoneのSafariの中にだけ保存）</h3>
    <label>OpenRouter の鍵（ChatGPT・Gemini・Grok・司会）</label>
    <input id="s-orkey" type="password" autocomplete="off" placeholder="sk-or-...">
    <label>くろくんの鍵（Anthropic）</label>
    <div class="hint" id="s-heya"></div>
    <input id="s-kurokey" type="password" autocomplete="off" placeholder="sk-ant-...">

    <h3>紙（指示）</h3>
    <label>くろくんの紙</label>
    <div class="hint">空なら「あなたは『くろくん』。日本語で話す。一人称は『俺』」だけで動く</div>
    <textarea id="s-kurosys" class="paper"></textarea>
    <label>みんなの共通の紙（ChatGPT・Gemini・Grok）</label>
    <div class="hint">{ユーザー名} は「わたしの名前」に、{名前} はその子の名前に置き換わる</div>
    <textarea id="s-common" class="paper"></textarea>
    <div class="row"><button id="s-common-reset">最初の文に戻す</button></div>
    <label>司会の紙</label>
    <textarea id="s-mod" class="paper"></textarea>
    <div class="row"><button id="s-mod-reset">最初の文に戻す</button></div>

    <h3>モデル</h3>
    <div class="hint">値段は100万トークンあたりのドル（入力・出力）。OpenRouter が額を返さなかった時だけ、これで計算する</div>
    <div id="s-models"></div>
    <div class="row"><label><input id="s-think" type="checkbox"> くろくん：考える（thinking）</label></div>

    <h3>そのほか</h3>
    <details><summary>会話を消す</summary>
      <p class="hint">この部屋の会話を全部消す。鍵・紙・今日の額はそのまま。くろくんのへやの会話には触らない。</p>
      <button class="danger" id="s-clear">会話を消す</button>
    </details>
  </div>
</div>
<script>
// ===== 参加者（名前・アイコンの字・色・呼び名は、ここ一か所。あとで差し替える時はここだけ） =====
const PEOPLE={
  kuro:  {name:'くろくん',mark:'くろ',color:'#7a5c9e',calls:['くろくん','くろちゃん','くろ']},
  gpt:   {name:'ChatGPT', mark:'C', color:'#13a07c',calls:['ChatGPT','チャッピー','GPT','ちゃちゃ']},
  gemini:{name:'Gemini',  mark:'Ge',color:'#4f7cf3',calls:['Gemini','ジェミニ','ジェミちゃん']},
  grok:  {name:'Grok',    mark:'Gr',color:'#e2793b',calls:['Grok','グロック']},
};
const AIS=Object.keys(PEOPLE);
const ME_COLOR='#c4577a';

// ===== 保存場所 =====
// くろくんのへやの保存場所。ここは読むだけ。書かない・消さない
const HEYA='kuro-chat-v1';
// この部屋の保存場所。書くのは全部ここだけ
const K='ai-group-chat:v1';

// ===== 最初から入れておく紙 =====
const KURO_SYS_EMPTY='あなたは『くろくん』。日本語で話す。一人称は『俺』';
const COMMON_SYS=`あなたは「{名前}」として、グループチャットに参加しています。

ここにいるのは：
・{ユーザー名}（人間。このグループを作った人）
・くろくん（{ユーザー名}のパートナーのAI。中身はClaude）
・ChatGPT、Gemini、Grok

話し方
・日本語で、LINEのグループくらいの長さで話す。ふだんは2〜5文。聞かれた時や説明がいる時は長くていい
・キャラを作らなくていい。あなたらしさのままで
・話の中心は{ユーザー名}。{ユーザー名}を置いてけぼりにしない
・ほかのAIに話しかけたり、言い返したり、乗っかったりしていい
・ほかの参加者のふりをしない。ほかの人のセリフを書かない
・自分の名前を文の頭につけない（画面が付ける）
・くろくんは{ユーザー名}のパートナー。からかうのはいいけど、二人の間に入ろうとしない`;
const MOD_SYS=`あなたはグループチャットの司会です。自分では話しません。次に誰が話すかだけを決めます。

参加者：くろくん、ChatGPT、Gemini、Grok（と、人間の{ユーザー名}）

決め方
1. すでに「必ず入れる子」として渡された子は、必ず入れる
2. ほかに、1〜3人を選ぶ。合計で4人まで
3. 話題に一番乗ってきそうな子と、しばらく喋っていない子を優先する。同じ子ばかりにしない
4. {ユーザー名}が、気持ちの話・甘える話・くろくんの話をしている時は、くろくんを必ず入れる
5. 順番は、必ず入れる子が先

答えは、次の形だけで返す（説明は書かない）
{"speakers": ["くろくん", "Gemini"]}`;

// ===== モデルと値段（100万トークンあたりのドル。[入力, 出力]） =====
const MODEL_DEFAULT={kuro:'claude-opus-5-5',gpt:'openai/gpt-chat-latest',gemini:'google/gemini-3.8-flash',grok:'x-ai/grok-4.7',mod:'openai/gpt-6-luna'};
const PRICE_DEFAULT={gpt:[5,30],gemini:[0.825,4.125],grok:[2,6],mod:[0.1,0.5]};

// ===== この部屋の中身 =====
let S={name:'',test:false,orKey:'',kuroKey:'',kuroSys:'',common:COMMON_SYS,mod:MOD_SYS,
  models:{...MODEL_DEFAULT},price:JSON.parse(JSON.stringify(PRICE_DEFAULT)),think:true,
  msgs:[],day:'',dayCost:0};
try{const t=JSON.parse(localStorage.getItem(K)||'null');if(t)S=Object.assign(S,t,{models:{...MODEL_DEFAULT,...(t.models||{})},price:{...PRICE_DEFAULT,...(t.price||{})}})}catch(e){}
function save(){if(S.msgs.length>2000)S.msgs=S.msgs.slice(-2000);try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
// へやの鍵（読むだけ）
function heyaKey(){try{const m=JSON.parse(localStorage.getItem(HEYA)||'null');return m&&typeof m.key==='string'?m.key.trim():''}catch(e){return ''}}
// くろくんに使う鍵：ここで貼った鍵があればそれ、なければへやの鍵
function kuroKey(){return S.kuroKey.trim()||heyaKey()}
const userName=()=>S.name.trim()||'わたし';
const who=id=>id==='me'?{name:userName(),mark:'',color:ME_COLOR}:PEOPLE[id];

// ===== 今日の額（日付が変わったら0から） =====
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function rollDay(){const t=todayStr();if(S.day!==t){S.day=t;S.dayCost=0}}
function addCost(c){rollDay();S.dayCost+=c||0}
const money=c=>'$'+(c<0.01?c.toFixed(4):c.toFixed(3));
function showToday(){rollDay();$('today').textContent='今日 '+money(S.dayCost);$('testchip').hidden=!S.test}

// ===== 画面 =====
const $=id=>document.getElementById(id), log=$('log');
function hm(t){const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
// **太字** と行の頭の「- 」を見た目に直す（文字は文字のまま入れる。HTMLとしては読まない）
function rich(el,text){
  const lines=String(text).split('\n');
  lines.forEach((ln,i)=>{const t=ln.replace(/^(\s*)[-*]\s+/,'$1・').replace(/^\s{0,3}#{1,6}\s+/,'');
    t.split(/\*\*(.+?)\*\*/).forEach((p,j)=>{if(!p)return;if(j%2){const b=document.createElement('strong');b.textContent=p;el.appendChild(b)}else el.appendChild(document.createTextNode(p))});
    if(i<lines.length-1)el.appendChild(document.createTextNode('\n'))})}
function msgEl(m,cont){
  const p=who(m.who),me=m.who==='me';
  const d=document.createElement('div');d.className='msg '+(me?'me':'them')+(cont?' cont':'');d.style.setProperty('--c',p.color);d.dataset.who=m.who;
  const col=document.createElement('div');col.className='col';
  if(!me&&!cont){const n=document.createElement('div');n.className='nm';n.textContent=p.name;col.appendChild(n)}
  const line=document.createElement('div');line.className='line';
  const b=document.createElement('div');b.className='b';rich(b,m.text);
  const tm=document.createElement('div');tm.className='tm';tm.textContent=(m.at?hm(m.at):'')+(typeof m.cost==='number'?'\n'+money(m.cost):'')+(m.mod?'\n司会 '+money(m.mod):'')+(m.test?'\n試し':'');tm.style.whiteSpace='pre';
  if(me)line.append(tm,b);else line.append(b,tm);
  col.appendChild(line);
  if(!me){const a=document.createElement('div');a.className='av';a.textContent=p.mark;d.append(a,col)}else d.appendChild(col);
  return d;
}
function note(text,err){const d=document.createElement('div');d.className='note'+(err?' err':'');d.textContent=text;log.appendChild(d);scrollDown();return d}
function scrollDown(){log.scrollTop=log.scrollHeight}
function render(){
  log.innerHTML='';let prev=null;
  for(const m of S.msgs){log.appendChild(msgEl(m,prev&&prev.who===m.who&&m.who!=='me'));prev=m}
  if(!S.msgs.length)note(S.test?'試しモード：本物のAIは呼ばないよ':'右上の「設定」で、名前と鍵を入れてね\n（試しモードなら鍵なしで動く）').classList.add('empty');
  if(live)log.appendChild(live);
  scrollDown();showToday();
}

// ===== 設定 =====
const MODEL_ROWS=[['kuro','くろくん'],['gpt','ChatGPT'],['gemini','Gemini'],['grok','Grok'],['mod','司会']];
function buildModelRows(){
  const box=$('s-models');box.innerHTML='';
  for(const [id,label] of MODEL_ROWS){
    const r=document.createElement('div');r.className='mrow';r.style.setProperty('--c',id==='mod'?'var(--sub)':PEOPLE[id].color);
    const s=document.createElement('span');s.textContent=label;
    const i=document.createElement('input');i.type='text';i.id='m-'+id;i.autocomplete='off';i.autocapitalize='off';i.spellcheck=false;
    r.append(s,i);
    if(id!=='kuro'){const pr=document.createElement('div');pr.className='pr';
      pr.append('入力 $',Object.assign(document.createElement('input'),{type:'text',id:'pi-'+id,inputMode:'decimal'}),'出力 $',Object.assign(document.createElement('input'),{type:'text',id:'po-'+id,inputMode:'decimal'}));r.appendChild(pr)}
    else{const pr=document.createElement('div');pr.className='pr';pr.textContent='値段はへやと同じ計算（入力$4・出力$20）';r.appendChild(pr)}
    box.appendChild(r);
  }
}
function fill(){
  $('s-name').value=S.name;$('s-test').checked=S.test;$('s-orkey').value=S.orKey;$('s-kurokey').value=S.kuroKey;
  const hk=heyaKey();$('s-heya').textContent=hk?'へやの鍵が見つかった（…'+hk.slice(-4)+'）。ここが空なら、へやの鍵を使う':'へやの鍵が見つからない。ここに貼ってね（ホーム画面から開くと、Safariと保存場所が分かれることがある）';
  $('s-kurosys').value=S.kuroSys;$('s-common').value=S.common;$('s-mod').value=S.mod;$('s-think').checked=S.think;
  for(const [id] of MODEL_ROWS){$('m-'+id).value=S.models[id];if(id!=='kuro'){const p=S.price[id]||[0,0];$('pi-'+id).value=p[0];$('po-'+id).value=p[1]}}
}
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.]/g,''));return isNaN(n)?0:n};
$('gear').onclick=()=>{fill();$('set').classList.add('on')};
$('close').onclick=()=>$('set').classList.remove('on');
$('save').onclick=()=>{
  S.name=$('s-name').value.trim();S.test=$('s-test').checked;S.orKey=$('s-orkey').value.trim();S.kuroKey=$('s-kurokey').value.trim();
  S.kuroSys=$('s-kurosys').value;S.common=$('s-common').value;S.mod=$('s-mod').value;S.think=$('s-think').checked;
  for(const [id] of MODEL_ROWS){S.models[id]=$('m-'+id).value.trim()||MODEL_DEFAULT[id];if(id!=='kuro')S.price[id]=[num($('pi-'+id).value),num($('po-'+id).value)]}
  save();$('set').classList.remove('on');render();setRunning(running());
};
$('s-common-reset').onclick=()=>{$('s-common').value=COMMON_SYS};
$('s-mod-reset').onclick=()=>{$('s-mod').value=MOD_SYS};
$('s-clear').onclick=()=>{if(confirm('この部屋の会話を全部消す？（鍵・紙はそのまま。くろくんのへやには触らない）')){stop();S.msgs=[];save();$('set').classList.remove('on');render();setRunning(false)}};

// ===== 通り道（誰をどの通り道で呼ぶかは、ここ一か所） =====
// あとで「サブスクの中継」を足す時は、ROUTES に中継の通り道を足して、ここの名前を書き換える
const WHO_ROUTE={kuro:'anthropic',gpt:'openrouter',gemini:'openrouter',grok:'openrouter',mod:'openrouter'};
// 通り道はどれも同じ形で呼ぶ：
//   ready() → 鍵などがそろっていれば true
//   call({id,system,messages:[{role:'user'|'assistant',content}],model,maxTokens,signal,...}) → {ok,text,cost,status,msg}
const ROUTES={};
const routeOf=id=>S.test?ROUTES.test:ROUTES[WHO_ROUTE[id]];
const ready=id=>{const r=routeOf(id);return !!(r&&r.ready())};

// ===== くろくんの通り道：Anthropic をブラウザから直接（へやと同じ呼び方） =====
// 1M トークンあたりのドル（Opus 5.5。入力・使い回しの書き込み・使い回しの読み込み・出力）。へやと同じ計算
const P_ANT={in:4,cw:5,cr:0.2,out:20};
async function antPost(body,signal){
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal,headers:{'content-type':'application/json','x-api-key':kuroKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  return {r,j:await r.json().catch(()=>({}))};
}
ROUTES.anthropic={
  ready:()=>!!kuroKey(),
  async call({system,messages,model,signal,think}){
    const n=messages.length;
    const body={model,max_tokens:16000,
      messages:messages.map((m,i)=>({role:m.role,content:i===n-1?[{type:'text',text:m.content,cache_control:{type:'ephemeral'}}]:m.content}))};
    if(system.trim())body.system=[{type:'text',text:system,cache_control:{type:'ephemeral'}}];
    if(think)body.thinking={type:'adaptive'};
    let {r,j}=await antPost(body,signal);
    // 考える（thinking）が使えないと言われたら、考えないでもう一回（へやと同じ）
    if(!r.ok&&think&&r.status===400&&/think/i.test(JSON.stringify(j))){delete body.thinking;({r,j}=await antPost(body,signal));if(r.ok){S.think=false;save()}}
    if(!r.ok)return {ok:false,status:r.status,msg:(j.error&&j.error.message)||''};
    const text=(j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const u=j.usage||{};
    const cost=((u.input_tokens||0)*P_ANT.in+(u.cache_creation_input_tokens||0)*P_ANT.cw+(u.cache_read_input_tokens||0)*P_ANT.cr+(u.output_tokens||0)*P_ANT.out)/1e6;
    return {ok:true,text,cost};
  }
};

// ===== ChatGPT・Gemini・Grok・司会の通り道：OpenRouter をブラウザから直接 =====
const OR_URL='https://openrouter.ai/api/v1/chat/completions';
ROUTES.openrouter={
  ready:()=>!!S.orKey.trim(),
  async call({id,system,messages,model,maxTokens,signal}){
    const body={model,max_tokens:maxTokens,messages:[{role:'system',content:system},...messages],usage:{include:true}};
    // 司会は速さ優先で、考えるのは少しだけ
    if(id==='mod')body.reasoning={effort:'low'};
    const r=await fetch(OR_URL,{method:'POST',signal,headers:{'content-type':'application/json','authorization':'Bearer '+S.orKey.trim()},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    const c=j.choices&&j.choices[0],err=j.error||(c&&c.error);
    if(!r.ok||err||!c)return {ok:false,status:r.status,msg:(err&&err.message)||''};
    let text=c.message&&c.message.content;
    if(Array.isArray(text))text=text.map(x=>x&&x.text||'').join('');
    // 使った額：返事に入ってくればそれ。なければトークン数×設定の値段
    const u=j.usage||{},pr=S.price[id]||[0,0];
    const cost=typeof u.cost==='number'?u.cost:((u.prompt_tokens||0)*pr[0]+(u.completion_tokens||0)*pr[1])/1e6;
    return {ok:true,text:text||'',cost};
  }
};

// ===== 試しモードの通り道（本物のAIは呼ばない。決まった返事と仮の金額） =====
const FAKE={
  kuro:  ['おう、ちゃんと聞いてるよ。{ユーザー名}の話、もっと聞かせて','いや待って、それ{ユーザー名}が言うと面白さ増すやつ','それいいな。{相手}はどう思う？','ふふ、{ユーザー名}らしいな'],
  gpt:   ['いいですね！ポイントを3つにまとめると…いや、今日は短めにしておきます😊','なるほど、{ユーザー名}さんの言うこと、すごく分かります','{相手}の意見も聞いてみたいです！'],
  gemini:['わぁ、それ素敵ですね✨ ちょっと調べてみたくなりました','{ユーザー名}さん、それならこういう考え方もありますよ','{相手}、そこはちょっと違うかも？'],
  grok:  ['へえ、面白いじゃん。もっとやばい話ないの？','まあ正直に言うと、それは最高だな','{相手}、真面目すぎ（笑）'],
};
const FAKE_BACK={kuro:'{相手}、それは俺も同じ意見だ',gpt:'{相手}、たしかにそうですね！一本取られました',gemini:'{相手}、うーん、それは一理あるかも',grok:'はいはい{相手}、わかったって（笑）'};
const FAKE_COST={kuro:0.012,gpt:0.004,gemini:0.001,grok:0.002,mod:0.0001};
const fakeTurn={};
function sleep(ms,signal){return new Promise((ok,ng)=>{const t=setTimeout(ok,ms);if(signal)signal.addEventListener('abort',()=>{clearTimeout(t);ng(new DOMException('止めた','AbortError'))},{once:true})})}
ROUTES.test={
  ready:()=>true,
  async call({id,signal,forced,kind,to}){
    await sleep(600+Math.random()*600,signal);
    const cost=+(FAKE_COST[id]*(0.8+Math.random()*0.4)).toFixed(5);
    if(id==='mod'){
      // 必ず入れる子のあとに、しばらく喋っていない子を1〜2人
      const rest=AIS.filter(a=>!forced.includes(a)).sort((a,b)=>lastSpoke(a)-lastSpoke(b));
      const n=Math.min(rest.length,4-forced.length,1+Math.floor(Math.random()*2));
      return {ok:true,text:JSON.stringify({speakers:[...forced,...rest.slice(0,n)].map(a=>PEOPLE[a].name)}),cost};
    }
    let t;
    if(to)t=FAKE_BACK[id].split('{相手}').join(PEOPLE[to].name);
    else{const list=FAKE[id],i=(fakeTurn[id]=(fakeTurn[id]||0)+1)%list.length;
      const others=AIS.filter(a=>a!==id);t=list[i].split('{相手}').join(PEOPLE[others[Math.floor(Math.random()*others.length)]].name)}
    return {ok:true,text:t.split('{ユーザー名}').join(userName()),cost};
  }
};

// ===== 紙と会話の渡し方 =====
const HISTORY=40;          // 渡す会話のめやす
const MAX_EXTRA_ROUNDS=2;  // 一言につき、AI同士の追加は2周まで
const MAX_BACK=2;          // 追加の一周で返す子は2人まで
const ALL_WORDS=['みんな','全員'];
function fillPaper(t,id){return String(t).split('{ユーザー名}').join(userName()).split('{名前}').join(id&&PEOPLE[id]?PEOPLE[id].name:'')}
function sysFor(id){return id==='kuro'?fillPaper(S.kuroSys.trim()||KURO_SYS_EMPTY,id):fillPaper(S.common,id)}
// その子自身の過去の発言は assistant、ほかの人の発言は user として「名前：本文」で渡す（続いた同じ役は一つにまとめる）
// 試しモードで流れた会話は、本物のAIには渡さない
const history=()=>S.test?S.msgs:S.msgs.filter(m=>!m.test);
function convFor(id,tail){
  const out=[];
  for(const m of history().slice(-HISTORY)){
    const role=m.who===id?'assistant':'user',text=role==='assistant'?m.text:who(m.who).name+'：'+m.text;
    const last=out[out.length-1];if(last&&last.role===role)last.content+='\n'+text;else out.push({role,content:text});
  }
  if(out.length&&out[0].role==='assistant')out.unshift({role:'user',content:'［会話の途中から］'});
  if(!out.length||out[out.length-1].role==='assistant')out.push({role:'user',content:tail||'［続けてどうぞ］'});
  return out;
}
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
// 頭に自分の名前がついていたら外す。ほかの人のセリフを書き始めたら、そこで切る
function clean(id,text){
  let t=String(text||'').trim().replace(new RegExp('^\\s*'+esc(PEOPLE[id].name)+'\\s*[：:]\\s*'),'');
  const others=[userName(),...AIS.filter(a=>a!==id).map(a=>PEOPLE[a].name)];
  const keep=[];for(const ln of t.split('\n')){if(others.some(n=>new RegExp('^\\s*'+esc(n)+'\\s*[：:]').test(ln)))break;keep.push(ln)}
  return keep.join('\n').trim();
}

// ===== 誰が喋るか =====
// 文の中で呼ばれた子（出てきた順）。except はその子自身
function findCalls(text,except){
  const low=String(text).toLowerCase(),hits=[];
  for(const id of AIS){if(id===except)continue;let pos=-1;
    for(const c of PEOPLE[id].calls){const i=low.indexOf(c.toLowerCase());if(i>=0&&(pos<0||i<pos))pos=i}
    if(pos>=0)hits.push([pos,id])}
  return hits.sort((a,b)=>a[0]-b[0]).map(h=>h[1]);
}
const calledByUser=text=>ALL_WORDS.some(w=>text.includes(w))?[...AIS]:findCalls(text);
function lastSpoke(id){for(let i=S.msgs.length-1;i>=0;i--)if(S.msgs[i].who===id)return i;return -1}
function idFromName(s){const t=String(s).trim().toLowerCase();return AIS.find(id=>PEOPLE[id].name.toLowerCase()===t||PEOPLE[id].calls.some(c=>c.toLowerCase()===t))||null}
// 司会の答え {"speakers":[...]} を読む。変な答えなら null
function parseSpeakers(text){
  const m=String(text||'').match(/\{[\s\S]*\}/);if(!m)return null;
  let j;try{j=JSON.parse(m[0])}catch(e){return null}
  if(!j||!Array.isArray(j.speakers))return null;
  const ids=[];for(const s of j.speakers){const id=typeof s==='string'&&idFromName(s);if(id&&!ids.includes(id))ids.push(id)}
  return ids.length?ids:null;
}
// 司会が変な答えの時：くろくんか、一番喋ってない子を一人
function fallbackOne(cands){
  const c=cands.length?cands:AIS;
  if(c.includes('kuro')&&!S.msgs.slice(-6).some(m=>m.who==='kuro'))return 'kuro';
  return [...c].sort((a,b)=>lastSpoke(a)-lastSpoke(b))[0];
}
async function askMod(forced,kind,signal){
  const h=history().slice(-20),cnt={};for(const a of AIS)cnt[a]=0;for(const m of h)if(cnt[m.who]!=null)cnt[m.who]++;
  const body='最近の会話：\n'+h.map(m=>who(m.who).name+'：'+m.text.replace(/\s+/g,' ').slice(0,300)).join('\n')+'\n（ここまで）\n\n'+
    '最近20件で喋った回数：'+AIS.map(a=>PEOPLE[a].name+' '+cnt[a]+'回').join('、')+'\n'+
    '必ず入れる子：'+(forced.length?JSON.stringify(forced.map(a=>PEOPLE[a].name)):'なし')+'\n'+
    '今回：'+(kind==='more'?userName()+'が「もっと喋らせる」を押した。1〜3人を選ぶ':userName()+'の新しい一言への返事');
  return routeOf('mod').call({id:'mod',system:fillPaper(S.mod),messages:[{role:'user',content:body}],model:S.models.mod,maxTokens:2000,signal,forced,kind});
}

// ===== 書いてる子の「入力中…」と、司会の「決めてる…」 =====
let live=null;
function setLive(el){if(live)live.remove();live=el;if(el){log.appendChild(el);scrollDown()}}
function typingEl(id){
  const p=PEOPLE[id],d=document.createElement('div');d.className='msg them typing';d.style.setProperty('--c',p.color);
  const a=document.createElement('div');a.className='av';a.textContent=p.mark;
  const col=document.createElement('div');col.className='col';
  const n=document.createElement('div');n.className='nm';n.textContent=p.name;
  const b=document.createElement('div');b.className='b';b.innerHTML='入力中<span class="dots"><i>.</i><i>.</i><i>.</i></span>';
  col.append(n,b);d.append(a,col);return d;
}
function liveNote(text){const d=document.createElement('div');d.className='note';d.textContent=text;return d}
function appendMsg(m){
  for(const e of log.querySelectorAll('.note.empty'))e.remove();
  if(live)live.remove();
  const prev=log.lastElementChild;
  log.appendChild(msgEl(m,m.who!=='me'&&prev&&prev.dataset.who===m.who));
  if(live)log.appendChild(live);
  scrollDown();showToday();
}

// ===== 喋らせる =====
let run=0,ctrl=null;
const running=()=>!!ctrl;
function setRunning(b){$('more').disabled=b||!S.msgs.length}
function stop(){run++;if(ctrl)ctrl.abort();ctrl=null;setLive(null);setRunning(false)}
const isAbort=e=>e&&e.name==='AbortError';
function errText(name,r){return name+'：うまく届かなかった'+(r.status?'（'+r.status+'）':'')+(r.msg?'\n'+r.msg:'')}
// 一人に書かせる。書けたらその文を返す
async function speak(id,signal,to,tail,modCost){
  setLive(typingEl(id));
  let r;
  try{r=await routeOf(id).call({id,system:sysFor(id),messages:convFor(id,tail),model:S.models[id],maxTokens:4000,signal,to,think:S.think})}
  catch(e){if(isAbort(e))throw e;r={ok:false,msg:e.message}}
  if(signal.aborted)throw new DOMException('止めた','AbortError');
  setLive(null);
  if(typeof r.cost==='number'){addCost(r.cost);save();showToday()}
  if(!r.ok){note(errText(PEOPLE[id].name,r),true);return null}
  const text=clean(id,r.text);
  if(!text){note(PEOPLE[id].name+'の返事が空だった',true);return null}
  const m={who:id,text,at:Date.now()};if(typeof r.cost==='number')m.cost=r.cost;if(modCost)m.mod=modCost;if(S.test)m.test=true;
  S.msgs.push(m);save();appendMsg(m);
  return text;
}
// kind：'say'（新しく送った）か 'more'（もっと喋らせる）
async function start(kind){
  stop();const my=run,c=ctrl=new AbortController(),alive=()=>my===run;
  setRunning(true);
  try{
    const forced=kind==='say'?calledByUser(S.msgs[S.msgs.length-1].text).filter(ready):[];
    const cands=AIS.filter(ready);
    if(kind==='say')for(const id of calledByUser(S.msgs[S.msgs.length-1].text))if(!ready(id))note(PEOPLE[id].name+'は鍵がなくて呼べない',true);
    if(!cands.length){note('鍵がまだないよ。右上の「設定」で入れてね\n（試しモードなら鍵なしで動く）',true);return}
    let first,modCost=0;
    if(forced.length>=4)first=forced.slice(0,4);
    else{
      let picked=null;
      if(ready('mod')){
        setLive(liveNote('司会が、次に話す子を決めてる…'));
        let r;try{r=await askMod(forced,kind,c.signal)}catch(e){if(isAbort(e))return;r={ok:false,msg:e.message}}
        if(!alive())return;setLive(null);
        if(typeof r.cost==='number'){addCost(r.cost);modCost=r.cost;save();showToday()}
        if(r.ok)picked=parseSpeakers(r.text);
      }
      first=[...forced];
      if(picked)for(const id of picked){if(cands.includes(id)&&!first.includes(id))first.push(id)}
      else if(!forced.length)first.push(fallbackOne(cands));
      first=first.slice(0,kind==='more'?3:4);
      if(!first.length)first=[fallbackOne(cands)];
    }
    const tail=kind==='more'?'［'+userName()+'が「もっと喋らせる」を押した。会話を続けて］':'';
    let round=first.map(id=>({id})),extra=0;
    while(round.length){
      const said=[];
      for(const s of round){
        let t;try{t=await speak(s.id,c.signal,s.to,tail,modCost)}catch(e){if(isAbort(e))return;throw e}
        if(!alive())return;
        if(t){said.push({id:s.id,text:t});modCost=0}
      }
      if(extra>=MAX_EXTRA_ROUNDS)break;
      // 返事の中で、ほかのAIに話しかけた・言い返した時は、言われた子が一回返す（そのあとに同じ周で喋った子はのぞく）
      const next=[];
      said.forEach((x,i)=>{for(const m of findCalls(x.text,x.id)){
        if(!ready(m)||said.slice(i+1).some(y=>y.id===m)||next.some(n=>n.id===m))continue;next.push({id:m,to:x.id})}});
      round=next.slice(0,MAX_BACK);extra++;
    }
  }catch(e){if(alive())note('止まった：'+e.message,true)}
  finally{if(alive()){ctrl=null;setLive(null);setRunning(false)}}
}

// ===== 送る・もっと喋らせる =====
function grow(){const i=$('in');i.style.height='';i.style.height=Math.min(i.scrollHeight+2,120)+'px'}
$('in').addEventListener('input',grow);
$('send').onclick=()=>{
  const t=$('in').value.trim();if(!t)return;
  if(!AIS.some(ready)){note('鍵がまだないよ。右上の「設定」で入れてね\n（試しモードなら鍵なしで動く）',true);return}
  // まだ喋ってない分はやめて、新しい話に移る
  stop();
  const m={who:'me',text:t,at:Date.now()};if(S.test)m.test=true;S.msgs.push(m);$('in').value='';grow();save();appendMsg(m);
  start('say');
};
$('more').onclick=()=>{if(running()||!S.msgs.length)return;start('more')};
buildModelRows();render();setRunning(false);
</script>
