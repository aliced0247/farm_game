<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#ff9ec4" />
<title>👑 おひめさまへの道</title>
<style>
  :root{
    --pink:#ff9ec4; --pink-dk:#e96aa0; --pink-lt:#ffe3ef;
    --gold:#f4c84a; --gold-dk:#caa01e;
    --purple:#9b7ede; --cream:#fff7fb; --ink:#5a3a4a;
    --shadow:0 4px 14px rgba(160,60,110,.22);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c",system-ui,sans-serif;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:linear-gradient(160deg,#ffd9e8 0%,#ffe9c9 50%,#e7d6ff 100%);
    color:var(--ink); overflow:hidden; user-select:none;
    display:flex; justify-content:center;
  }
  #app{
    width:100%; max-width:480px; height:100dvh; position:relative;
    display:flex; flex-direction:column; background:var(--cream);
    box-shadow:0 0 40px rgba(180,90,140,.25);
  }

  /* ===== top bar ===== */
  #topbar{
    display:flex; align-items:center; gap:6px; padding:8px 10px;
    background:linear-gradient(90deg,var(--pink),var(--purple));
    color:#fff; font-weight:700; box-shadow:0 2px 8px rgba(120,50,100,.3);
    z-index:5;
  }
  .chip{
    background:rgba(255,255,255,.22); border-radius:14px; padding:4px 9px;
    font-size:13px; display:flex; align-items:center; gap:3px; white-space:nowrap;
  }
  #topbar .grow{flex:1;}
  .iconbtn{
    background:rgba(255,255,255,.25); border:none; color:#fff; font-size:17px;
    width:34px; height:34px; border-radius:50%; cursor:pointer;
  }
  .iconbtn:active{transform:scale(.92);}

  /* ===== stage ===== */
  #stage{
    flex:1; position:relative; overflow:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    background:
      radial-gradient(circle at 50% 18%, #ffffffaa, transparent 55%),
      linear-gradient(180deg,#fff2f8 0%,#ffe6f1 60%,#f5e6ff 100%);
  }
  /* scenery */
  #scene{
    width:100%; text-align:center; padding-top:6px; font-size:13px; color:var(--pink-dk);
    font-weight:700; letter-spacing:.5px;
  }
  #heroine{
    margin-top:4px; font-size:96px; line-height:1; filter:drop-shadow(0 6px 6px rgba(180,90,140,.3));
    transition:transform .15s; position:relative;
  }
  #heroine.bounce{animation:hop .5s;}
  @keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}}
  #dresslabel{font-size:13px; color:var(--ink); margin-top:2px; font-weight:700;}
  #speech{
    margin:10px 14px 4px; background:#fff; border:2px solid var(--pink);
    border-radius:16px; padding:10px 14px; font-size:14px; line-height:1.5;
    box-shadow:var(--shadow); min-height:48px; position:relative; max-width:92%;
    animation:pop .25s;
  }
  #speech:after{
    content:""; position:absolute; top:-10px; left:40px; border:8px solid transparent;
    border-bottom-color:var(--pink);
  }
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

  /* progress to princess */
  #goalbar{
    margin:6px 12px 0; background:#fff; border-radius:14px; padding:8px 10px;
    box-shadow:var(--shadow); font-size:11.5px;
  }
  #goalbar h4{margin:0 0 5px; font-size:12px; color:var(--pink-dk); display:flex; gap:6px; align-items:center;}
  .reqrow{display:flex; align-items:center; gap:6px; margin:3px 0;}
  .reqrow .lbl{width:64px; flex:none; color:var(--ink);}
  .bar{flex:1; height:9px; background:#f1d9e6; border-radius:6px; overflow:hidden;}
  .bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--pink),var(--gold)); width:0; transition:width .4s;}
  .reqrow .val{width:54px; flex:none; text-align:right; font-variant-numeric:tabular-nums; color:#a06;}
  .reqrow.done .val:after{content:" ✅";}

  /* ===== actions ===== */
  #actions{
    background:var(--pink-lt); border-top:3px solid var(--pink);
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));
    display:grid; grid-template-columns:repeat(3,1fr); gap:7px; z-index:4;
  }
  .act{
    background:#fff; border:2px solid var(--pink); border-radius:14px;
    padding:8px 4px; text-align:center; cursor:pointer; box-shadow:0 2px 0 var(--pink-dk);
    transition:transform .08s;
  }
  .act:active{transform:translateY(2px); box-shadow:none;}
  .act .em{font-size:24px; display:block;}
  .act .nm{font-size:12px; font-weight:700; margin-top:1px;}
  .act .cost{font-size:10px; color:#b07; margin-top:1px;}
  .act.special{border-color:var(--gold); box-shadow:0 2px 0 var(--gold-dk); background:#fffbe9;}
  .act.disabled{opacity:.45; pointer-events:none;}

  /* ===== modal ===== */
  #overlay{
    position:absolute; inset:0; background:rgba(90,30,60,.45); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:20; padding:18px;
  }
  #overlay.show{display:flex;}
  .modal{
    background:var(--cream); border-radius:20px; width:100%; max-width:380px;
    max-height:86dvh; overflow-y:auto; box-shadow:0 12px 40px rgba(90,20,60,.4);
    border:3px solid var(--gold); animation:pop .25s;
  }
  .modal h2{
    margin:0; padding:14px 16px; font-size:17px; text-align:center; color:#fff;
    background:linear-gradient(90deg,var(--pink),var(--purple)); position:sticky; top:0;
  }
  .modal .body{padding:14px 16px;}
  .modal p{font-size:14px; line-height:1.55; margin:0 0 10px;}
  .closebtn{display:block; width:100%; margin-top:10px;}

  .btn{
    background:linear-gradient(90deg,var(--pink),var(--pink-dk)); color:#fff; border:none;
    border-radius:13px; padding:11px 14px; font-size:15px; font-weight:700; cursor:pointer;
    box-shadow:0 3px 0 var(--pink-dk); width:100%;
  }
  .btn:active{transform:translateY(2px); box-shadow:none;}
  .btn.gold{background:linear-gradient(90deg,var(--gold),var(--gold-dk)); box-shadow:0 3px 0 var(--gold-dk);}
  .btn.ghost{background:#fff; color:var(--pink-dk); border:2px solid var(--pink); box-shadow:0 3px 0 var(--pink);}
  .btn+.btn{margin-top:8px;}

  /* shop list */
  .shopitem{
    display:flex; align-items:center; gap:10px; background:#fff; border:2px solid var(--pink-lt);
    border-radius:14px; padding:9px 10px; margin-bottom:8px;
  }
  .shopitem .em{font-size:32px;}
  .shopitem .info{flex:1;}
  .shopitem .info .nm{font-weight:700; font-size:14px;}
  .shopitem .info .ds{font-size:11px; color:#a06;}
  .shopitem .buy{flex:none; font-size:13px; padding:8px 10px; width:auto;}
  .shopitem.owned{opacity:.8;}
  .shopitem.worn{border-color:var(--gold); background:#fffbe9;}
  .tag{font-size:10px; background:var(--gold); color:#5a3; color:#7a5a00; padding:2px 6px; border-radius:8px; font-weight:700;}

  /* fly text */
  .fly{position:absolute; font-weight:800; font-size:18px; pointer-events:none; z-index:30;
    animation:fly 1.1s ease-out forwards; text-shadow:0 1px 2px #fff;}
  @keyframes fly{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}
  .sparkle{position:absolute; pointer-events:none; font-size:20px; animation:spark 1s ease-out forwards; z-index:29;}
  @keyframes spark{0%{transform:scale(.4) rotate(0);opacity:1}100%{transform:scale(1.4) rotate(40deg);opacity:0}}

  .center{text-align:center;}
  .small{font-size:12px; color:#a06;}
  .statgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:8px 0;}
  .statcard{background:#fff; border:2px solid var(--pink-lt); border-radius:12px; padding:8px; text-align:center;}
  .statcard .v{font-size:20px; font-weight:800; color:var(--pink-dk);}
  .statcard .k{font-size:11px;}
  #confetti{position:absolute; inset:0; pointer-events:none; z-index:25; overflow:hidden;}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="chip">📅 <span id="t-day">1</span>日目</span>
    <span class="chip">⭐ <span id="t-ap">3</span></span>
    <span class="chip">💰 <span id="t-money">100</span></span>
    <span class="grow"></span>
    <button class="iconbtn" id="btn-shop" title="ドレス屋">👗</button>
    <button class="iconbtn" id="btn-prince" title="王子">🤴</button>
    <button class="iconbtn" id="btn-sound" title="音">🔊</button>
    <button class="iconbtn" id="btn-help" title="あそびかた">❓</button>
  </div>

  <div id="stage">
    <div id="scene">🏰 ＊ ✧ おひめさまへの道 ✧ ＊ 🏰</div>
    <div id="heroine">👧</div>
    <div id="dresslabel">もめんのワンピース</div>
    <div id="speech">わたし、いつかお姫様になりたいの…！<br>レッスンをして、すてきなレディになろう♡</div>

    <div id="goalbar">
      <h4>👑 お姫様認定じょうけん</h4>
      <div class="reqrow" data-req="grace"><span class="lbl">👑 気品</span><div class="bar"><i></i></div><span class="val">0</span></div>
      <div class="reqrow" data-req="edu"><span class="lbl">📚 教養</span><div class="bar"><i></i></div><span class="val">0</span></div>
      <div class="reqrow" data-req="beauty"><span class="lbl">💄 美容</span><div class="bar"><i></i></div><span class="val">0</span></div>
      <div class="reqrow" data-req="charm"><span class="lbl">🗣️ 社交</span><div class="bar"><i></i></div><span class="val">0</span></div>
      <div class="reqrow" data-req="love"><span class="lbl">💗 王子</span><div class="bar"><i></i></div><span class="val">0</span></div>
      <div class="reqrow" data-req="rank"><span class="lbl">✨ ドレス格</span><div class="bar"><i></i></div><span class="val">0</span></div>
    </div>
  </div>

  <div id="actions"></div>
  <div id="confetti"></div>
</div>

<div id="overlay"><div class="modal" id="modal"></div></div>

<script>
"use strict";
(function(){
const SAVE_KEY = "princessgame_v1";

/* ---------- data ---------- */
const REQ = { grace:100, edu:80, beauty:80, charm:80, love:100, rank:4 };

const DRESSES = {
  cotton:  {name:"もめんのワンピース", em:"👚", price:0,    rank:0, bonus:{}},
  outing:  {name:"よそゆきドレス",     em:"👗", price:200,  rank:1, bonus:{beauty:5}},
  silk:    {name:"きぬのドレス",       em:"🥻", price:700,  rank:2, bonus:{grace:8, beauty:8}},
  evening: {name:"やかいドレス",       em:"👘", price:1800, rank:3, bonus:{grace:10, edu:8, beauty:10, charm:8}},
  palace:  {name:"おうきゅうドレス",   em:"👰", price:4500, rank:4, bonus:{grace:15, edu:12, beauty:15, charm:12}},
  tiara:   {name:"でんせつのティアラドレス", em:"💎", price:9000, rank:5, bonus:{grace:25, edu:20, beauty:20, charm:20}},
};
const DRESS_ORDER = ["cotton","outing","silk","evening","palace","tiara"];

const STAT_INFO = {
  grace:{name:"気品", em:"👑"}, edu:{name:"教養", em:"📚"},
  beauty:{name:"美容", em:"💄"}, charm:{name:"社交", em:"🗣️"},
};

/* ---------- state ---------- */
let S;
function freshState(){
  return {
    day:1, ap:3, apMax:3, money:100,
    grace:8, edu:8, beauty:8, charm:8,
    dress:"cotton", owned:{cotton:true},
    princeMet:false, love:0,
    lastBall:0, muted:false, ended:false,
    seenIntro:false,
  };
}
function load(){
  try{ const r = localStorage.getItem(SAVE_KEY); if(r){ S = Object.assign(freshState(), JSON.parse(r)); return; } }catch(e){}
  S = freshState();
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- sound (WebAudio synth) ---------- */
let actx=null;
function beep(freq, dur, type){
  if(S.muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.12, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
const SFX = {
  tap:()=>beep(620,.08,"triangle"),
  good:()=>{beep(660,.1,"sine"); setTimeout(()=>beep(880,.12,"sine"),90);},
  coin:()=>{beep(880,.07,"square"); setTimeout(()=>beep(1180,.1,"square"),70);},
  love:()=>{beep(700,.1,"sine"); setTimeout(()=>beep(1040,.16,"sine"),100);},
  sleep:()=>{beep(440,.18,"sine"); setTimeout(()=>beep(330,.22,"sine"),140);},
  fanfare:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.22,"sine"),i*130));},
};

/* ---------- helpers ---------- */
const $ = s=>document.querySelector(s);
const rnd = (a,b)=>Math.floor(Math.random()*(b-a+1))+a;
function dressRank(){ return DRESSES[S.dress].rank; }
function dressBonus(stat){ return DRESSES[S.dress].bonus[stat]||0; }
function effStat(stat){ return S[stat] + dressBonus(stat); } // displayed/effective value

/* ---------- render ---------- */
const heroEm = ()=>{
  const r = dressRank();
  return DRESSES[S.dress].em;
};
function render(){
  $("#t-day").textContent = S.day;
  $("#t-ap").textContent = S.ap;
  $("#t-money").textContent = S.money;
  $("#btn-sound").textContent = S.muted ? "🔇":"🔊";
  $("#heroine").textContent = S.love>=REQ.love && S.ended ? "👸" : heroEm();
  $("#dresslabel").textContent = DRESSES[S.dress].name + "（格"+dressRank()+"）";

  // goal bars (use effective stats so wearing a dress visibly helps)
  document.querySelectorAll(".reqrow").forEach(row=>{
    const k = row.dataset.req;
    let cur, need;
    if(k==="love"){ cur=S.love; need=REQ.love; }
    else if(k==="rank"){ cur=dressRank(); need=REQ.rank; }
    else { cur=effStat(k); need=REQ[k]; }
    const pct = Math.min(100, cur/need*100);
    row.querySelector("i").style.width = pct+"%";
    row.querySelector(".val").textContent = (k==="rank") ? (cur+"/"+need) : Math.floor(cur)+"/"+need;
    row.classList.toggle("done", cur>=need);
  });
  renderActions();
}

const ACTIONS = [
  {id:"study",  em:"📚", nm:"べんきょう", cost:"教養UP",       ap:1, money:0,   run(){ gain("edu", rnd(4,7)); say("本を読んでお勉強♪ かしこくなった気がする！"); }},
  {id:"dance",  em:"💃", nm:"ダンス",     cost:"気品UP",       ap:1, money:0,   run(){ gain("grace", rnd(4,7)); say("くるくる…ダンスのレッスン！ 姿勢もきれいに✨"); }},
  {id:"beauty", em:"💄", nm:"おていれ",   cost:"美容UP -¥20",  ap:1, money:-20, run(){ gain("beauty", rnd(5,8)); say("エステでつるつるに♡ お肌がぴかぴかよ！"); }},
  {id:"tea",    em:"🍵", nm:"おちゃ会",   cost:"社交UP -¥10",  ap:1, money:-10, run(){ teaParty(); }},
  {id:"work",   em:"🌹", nm:"おしごと",   cost:"お金GET",      ap:1, money:0,   run(){ const m=rnd(35,65); S.money+=m; fly("+¥"+m,"#caa01e"); SFX.coin(); say("ししゅうのお仕事でおこづかいGET！ ¥"+m+" もらえたよ。"); }},
  {id:"sleep",  em:"😴", nm:"ねる",       cost:"つぎの日へ",   ap:0, money:0,   special:true, run(){ sleep(); }},
];
function renderActions(){
  const wrap = $("#actions"); wrap.innerHTML="";
  ACTIONS.forEach(a=>{
    const div=document.createElement("div");
    div.className="act"+(a.special?" special":"");
    const noAp = a.ap>0 && S.ap<a.ap;
    const noMoney = a.money<0 && S.money < -a.money;
    if(noAp||noMoney) div.classList.add("disabled");
    div.innerHTML = `<span class="em">${a.em}</span><span class="nm">${a.nm}</span><span class="cost">${a.cost}</span>`;
    div.onclick = ()=>{ if(div.classList.contains("disabled")){ noAp?say("⭐行動力がたりないわ…「ねる」で次の日へ。"):say("💰お金がたりないみたい…"); return; } doAction(a); };
    wrap.appendChild(div);
  });
}

function say(t){ $("#speech").innerHTML=t; $("#speech").style.animation="none"; void $("#speech").offsetWidth; $("#speech").style.animation="pop .25s"; }
function bounce(){ const h=$("#heroine"); h.classList.remove("bounce"); void h.offsetWidth; h.classList.add("bounce"); }

function gain(stat, amt){
  S[stat]+=amt;
  fly("+"+amt+" "+STAT_INFO[stat].em, "#e96aa0");
  SFX.good(); bounce();
}

function doAction(a){
  if(a.ap>0) S.ap-=a.ap;
  if(a.money<0) S.money+=a.money;
  SFX.tap();
  a.run();
  save(); render();
  checkPrincess();
}

function teaParty(){
  gain("charm", rnd(4,7));
  // chance to meet prince and raise love
  if(S.princeMet && Math.random()<0.45){
    const l=rnd(3,6); S.love=Math.min(REQ.love, S.love+l);
    fly("+"+l+" 💗", "#e0367a"); SFX.love();
    say("お茶会に王子さまが…！ すてきな会話で恋ごころ +"+l+" 💗");
  } else {
    say("お茶会でおしゃべり♪ 上品なふるまいが板についてきた！");
  }
}

/* ---------- fly / sparkle effects ---------- */
function fly(text, color){
  const st=$("#stage").getBoundingClientRect();
  const el=document.createElement("div"); el.className="fly"; el.textContent=text;
  el.style.color=color||"#e96aa0";
  el.style.left=(st.width/2 - 20 + rnd(-30,30))+"px";
  el.style.top="46%";
  $("#stage").appendChild(el);
  setTimeout(()=>el.remove(),1100);
  for(let i=0;i<4;i++){
    const sp=document.createElement("div"); sp.className="sparkle"; sp.textContent="✨";
    sp.style.left=(st.width/2-20+rnd(-50,50))+"px"; sp.style.top=(40+rnd(-10,20))+"%";
    $("#stage").appendChild(sp); setTimeout(()=>sp.remove(),1000);
  }
}

/* ---------- day / sleep ---------- */
function sleep(){
  SFX.sleep();
  S.day++; S.ap=S.apMax;
  // ball every 5 days
  if(S.day % 5 === 0 && S.day !== S.lastBall){
    save();
    setTimeout(()=>ball(), 350);
    return;
  }
  // random morning event
  morningEvent();
  save(); render(); checkPrincess();
}

const MORNING = [
  ()=>{ S.money+=50; fly("+¥50","#caa01e"); SFX.coin(); return "道でお財布をひろって交番へ。お礼に ¥50 もらえたよ！"; },
  ()=>{ gain("grace",4); return "おばあさんの荷物を持ってあげた。気品 +4、心もきれい♡"; },
  ()=>{ gain("edu",3); return "朝、町の図書館で一冊読んだ。教養 +3！"; },
  ()=>{ gain("beauty",3); return "ぐっすり眠れてお肌の調子もばっちり。美容 +3♪"; },
  ()=>{ gain("charm",3); return "市場でみんなとおしゃべり。社交 +3になった！"; },
  ()=>{ return "今日はいいお天気。さあ、レディへの道をすすもう！"; },
];
function morningEvent(){
  let txt = "🌅 "+S.day+"日目の朝。";
  if(Math.random()<0.5){ txt += "<br>"+MORNING[rnd(0,MORNING.length-1)](); }
  else { txt += "<br>さあ、今日もレッスンをがんばろう♡"; }
  say(txt);
}

/* ---------- ball (舞踏会) ---------- */
function ball(){
  S.lastBall = S.day;
  if(!S.princeMet) S.princeMet = true;
  const score = Math.round(
    effStat("grace")*1.0 + effStat("beauty")*1.0 +
    effStat("edu")*0.6 + effStat("charm")*0.8 + dressRank()*45
  );
  let rank, reward, lovegain, msg, prince;
  if(score>=460){ rank="✨大成功✨"; reward=rnd(400,600); lovegain=14; }
  else if(score>=320){ rank="成功！"; reward=rnd(250,380); lovegain=10; }
  else if(score>=190){ rank="まずまず"; reward=rnd(120,220); lovegain=6; }
  else { rank="いまひとつ…"; reward=rnd(40,90); lovegain=2; }
  S.money += reward;
  const before=S.love; S.love=Math.min(REQ.love, S.love+lovegain);
  const got = S.love-before;

  const lines = [
    "「やあ、今夜は一段ときれいだね。」",
    "「君のダンス、目をうばわれてしまったよ。」",
    "「また会えてうれしい。次の曲も僕と踊って？」",
    "「君と話していると時間を忘れてしまうな。」",
  ];
  prince = (got>0) ? lines[rnd(0,lines.length-1)] : "（王子さまは遠くから君を見ているみたい…もっと磨かなくちゃ！）";

  SFX.fanfare(); confetti(14);
  modal(`💃 舞踏会`,
    `<p class="center" style="font-size:15px">きらびやかな舞踏会の夜。<br><b>${DRESSES[S.dress].name}</b> をまとって会場へ…</p>
     <div class="center" style="font-size:60px">🕯️💃🤴🕯️</div>
     <p class="center"><b style="color:#e0367a;font-size:18px">${rank}</b><br>評価スコア：${score}</p>
     <p>💰 ごほうび <b>+¥${reward}</b>${got>0?`<br>💗 王子との恋ごころ <b>+${got}</b>`:""}</p>
     <p style="color:#9b5; color:#7a5a9b">🤴 王子：${prince}</p>
     <button class="btn gold" onclick="__close()">うっとり♡</button>`);
  save(); render();
  setTimeout(checkPrincess, 400);
}

/* ---------- prince screen ---------- */
function princeScreen(){
  if(!S.princeMet){
    modal("🤴 王子さま", `<p class="center" style="font-size:54px">🏰</p>
      <p class="center">まだ王子さまには出会っていないみたい。<br><b>5日目の舞踏会</b>できっと出会えるはず…！</p>
      <button class="btn ghost" onclick="__close()">とじる</button>`);
    return;
  }
  const pct = Math.round(S.love/REQ.love*100);
  let mood = S.love>=100?"「君を、僕のお姫様にしたい。」":
             S.love>=70 ?"「君のことが、もっと知りたいんだ。」":
             S.love>=40 ?"「また舞踏会で会えるのを楽しみにしているよ。」":
                         "「やあ、また会ったね。」";
  modal("🤴 アレク王子",
    `<p class="center" style="font-size:54px">🤴</p>
     <p class="center" style="color:#7a5a9b">${mood}</p>
     <div class="bar" style="height:14px;margin:8px 0"><i style="width:${pct}%"></i></div>
     <p class="center small">恋ごころ ${S.love} / ${REQ.love}</p>
     <p class="small">💡 <b>おちゃ会</b>で王子に会えたり、<b>舞踏会</b>で評価が高いと恋ごころが上がるよ。</p>
     <button class="btn ghost" onclick="__close()">とじる</button>`);
}

/* ---------- shop ---------- */
function shop(){
  let html = `<p class="small">すてきなドレスは舞踏会の評価とステータスをぐっと上げる♡ 着るとボーナスがつくよ。</p>`;
  DRESS_ORDER.forEach(k=>{
    const d=DRESSES[k]; const owned=!!S.owned[k]; const worn=S.dress===k;
    const bonusTxt = Object.keys(d.bonus).length
      ? Object.entries(d.bonus).map(([s,v])=>STAT_INFO[s].em+"+"+v).join(" ")
      : "ボーナスなし";
    let action;
    if(worn) action = `<span class="tag">着用中</span>`;
    else if(owned) action = `<button class="btn ghost buy" onclick="__wear('${k}')">きがえる</button>`;
    else action = `<button class="btn buy" onclick="__buy('${k}')">¥${d.price}</button>`;
    html += `<div class="shopitem ${worn?'worn':owned?'owned':''}">
      <span class="em">${d.em}</span>
      <div class="info"><div class="nm">${d.name} <span class="small">格${d.rank}</span></div>
        <div class="ds">${bonusTxt}</div></div>
      ${action}</div>`;
  });
  html += `<button class="btn ghost closebtn" onclick="__close()">とじる</button>`;
  modal("👗 ドレス屋さん", html);
}
window.__buy = function(k){
  const d=DRESSES[k];
  if(S.money < d.price){ SFX.tap(); shopMsg("お金がたりないわ…おしごとで稼ごう！"); return; }
  S.money-=d.price; S.owned[k]=true; S.dress=k;
  SFX.coin(); save(); render(); shop();
  setTimeout(()=>shopMsg(d.name+"を買って着がえたよ♡ とってもすてき！"),30);
};
window.__wear = function(k){ S.dress=k; SFX.tap(); save(); render(); shop(); };
function shopMsg(t){
  const body=$("#modal .body"); if(!body) return;
  let note=body.querySelector(".shopnote");
  if(!note){ note=document.createElement("div"); note.className="shopnote";
    note.style.cssText="background:#fffbe9;border:2px solid var(--gold);border-radius:12px;padding:8px 10px;margin-bottom:8px;font-size:13px;text-align:center;";
    body.insertBefore(note, body.firstChild);
  }
  note.textContent=t;
}

/* ---------- princess ending ---------- */
function meetsAll(){
  return effStat("grace")>=REQ.grace && effStat("edu")>=REQ.edu &&
         effStat("beauty")>=REQ.beauty && effStat("charm")>=REQ.charm &&
         S.love>=REQ.love && dressRank()>=REQ.rank;
}
function checkPrincess(){
  if(S.ended) return;
  if(meetsAll()){
    S.ended=true; save();
    SFX.fanfare(); confetti(40);
    setTimeout(()=>{
      modal("👑 お姫様にんてい！",
        `<div class="center" style="font-size:70px">👸✨</div>
         <p class="center" style="font-size:15px"><b>おめでとう！</b><br>あなたは気品も教養も美しさもそなえた<br>すてきなレディになりました。</p>
         <p class="center" style="color:#7a5a9b">🤴 アレク王子：<br>「どうか、僕のお姫様になってください。」</p>
         <p class="center" style="font-size:15px">こうして あなたは<br><b>本物のお姫様👑</b>になったのです。</p>
         <p class="center small">クリア日数：${S.day}日 ／ 所持金：¥${S.money}</p>
         <button class="btn gold" onclick="__close()">しあわせ…♡</button>
         <button class="btn ghost" onclick="__reset()">もういちど あそぶ</button>`);
    },500);
    render();
  }
}

/* ---------- confetti ---------- */
function confetti(n){
  const wrap=$("#confetti"); const ems=["🎉","✨","💗","👑","🌸","💎"];
  for(let i=0;i<n;i++){
    const e=document.createElement("div");
    e.textContent=ems[rnd(0,ems.length-1)];
    e.style.cssText=`position:absolute;left:${rnd(0,100)}%;top:-30px;font-size:${rnd(16,28)}px;`;
    wrap.appendChild(e);
    const dur=rnd(1400,2600);
    e.animate([{transform:`translateY(0) rotate(0)`,opacity:1},
               {transform:`translateY(${rnd(420,640)}px) rotate(${rnd(180,540)}deg)`,opacity:0}],
              {duration:dur,easing:"ease-in"});
    setTimeout(()=>e.remove(),dur);
  }
}

/* ---------- modal plumbing ---------- */
function modal(title, bodyHtml){
  $("#modal").innerHTML = `<h2>${title}</h2><div class="body">${bodyHtml}</div>`;
  $("#overlay").classList.add("show");
}
window.__close = function(){ $("#overlay").classList.remove("show"); render(); };
window.__reset = function(){
  if(confirm("さいしょから あそびますか？（このゲームのデータが消えます）")){
    S=freshState(); save(); __close(); render(); intro();
  }
};
$("#overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") __close(); });

/* ---------- help / intro ---------- */
function help(){
  modal("❓ あそびかた",
    `<p>平民の女の子が、レッスンで自分を磨いて <b>お姫様👑</b> をめざすゲームです。</p>
     <p>🔹 1日に <b>⭐行動力</b> が3つ。レッスンで使い、<b>😴ねる</b>で次の日へ。</p>
     <p>🔹 <b>📚💃💄🍵</b> でステータスUP、<b>🌹おしごと</b>でお金GET。</p>
     <p>🔹 <b>👗ドレス屋</b>でドレスを買うとボーナス＆「格」が上がる。</p>
     <p>🔹 <b>5日ごとに💃舞踏会</b>。評価が高いとお金＆王子との恋ごころUP！</p>
     <p>🔹 上の <b>お姫様認定じょうけん</b> を全部みたすとクリア♡</p>
     <button class="btn ghost" onclick="__close()">わかった！</button>`);
}
function intro(){
  if(S.seenIntro) return;
  S.seenIntro=true; save();
  modal("👑 おひめさまへの道",
    `<div class="center" style="font-size:60px">👧→👸</div>
     <p class="center">むかしむかし、お姫様にあこがれる<br>ひとりの女の子がいました。</p>
     <p class="center">レッスンで気品・教養・美しさをみがき、<br>すてきなドレスをまとって舞踏会へ。<br>そして王子さまと恋を実らせれば…？</p>
     <p class="center small">さあ、お姫様への道をはじめましょう♡</p>
     <button class="btn gold" onclick="__close()">はじめる！</button>
     <button class="btn ghost" id="introhelp">あそびかたを見る</button>`);
  const ih=$("#introhelp"); if(ih) ih.onclick=()=>{ __close(); help(); };
}

/* ---------- buttons ---------- */
$("#btn-shop").onclick = ()=>{ SFX.tap(); shop(); };
$("#btn-prince").onclick = ()=>{ SFX.tap(); princeScreen(); };
$("#btn-help").onclick = ()=>{ SFX.tap(); help(); };
$("#btn-sound").onclick = ()=>{ S.muted=!S.muted; save(); render(); if(!S.muted) SFX.tap(); };

/* ---------- boot ---------- */
load(); render();
if(S.ended){ /* allow viewing finished save */ }
else intro();
})();
</script>
