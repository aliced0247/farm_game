<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#8ec96a" />
<title>ぼくじょう物語 🌱 Phaser版</title>
<style>
  :root{ --bar:#6b4a2b; --bar2:#8a623c; --panel:#fff7e6; --line:#c79a5b; --text:#4a3526; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{ font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; background:#5a8a3c;
    color:var(--text); user-select:none; -webkit-user-select:none; overscroll-behavior:none; touch-action:none;
    display:flex; flex-direction:column; align-items:center; height:100%; }
  #app{ width:100%; max-width:520px; height:100%; display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }

  #topbar{ display:flex; gap:6px; padding:8px 8px; background:linear-gradient(180deg,var(--bar2),var(--bar));
    box-shadow:0 3px 0 #50341d, 0 4px 8px rgba(0,0,0,.25); z-index:5; }
  .stat{ flex:1; background:var(--panel); border:2px solid var(--line); border-radius:11px; padding:4px;
    text-align:center; display:flex; flex-direction:column; gap:2px; box-shadow:inset 0 -3px 0 #e7cf9a; }
  .stat .lbl{ font-size:9px; color:#9a7b4a; font-weight:700; }
  .stat .val{ font-size:16px; font-weight:800; line-height:1; }
  #staminaBarWrap,#expBarWrap{ height:5px; background:#e7cf9a; border-radius:4px; overflow:hidden; margin-top:3px; }
  #staminaBar{ height:100%; width:100%; background:linear-gradient(90deg,#ffd14d,#ff8a3d); transition:width .3s; }
  #expBar{ height:100%; width:0%; background:linear-gradient(90deg,#9be84d,#3fae54); transition:width .3s; }

  #stage{ flex:1; position:relative; overflow:hidden; background:#6ea83f; }
  #stage canvas{ display:block; }
  #loadMsg{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#fff;
    font-weight:700; font-size:14px; text-align:center; padding:20px; z-index:1; }
  #speech{ position:absolute; top:8px; left:50%; transform:translateX(-50%); max-width:88%; background:#fff;
    border:2px solid var(--line); border-radius:14px; padding:7px 13px; font-size:12.5px; font-weight:700;
    color:#7a5326; box-shadow:0 3px 0 #c79a5b; opacity:0; transition:opacity .3s; pointer-events:none; text-align:center; z-index:4; }
  #speech.show{ opacity:1; }
  #muteBtn{ position:absolute; top:8px; right:8px; z-index:6; width:36px; height:36px; border-radius:50%;
    border:2px solid var(--line); background:var(--panel); font-size:17px; cursor:pointer; box-shadow:0 3px 0 #c79a5b; }
  #muteBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #c79a5b; }

  #seedbar{ display:flex; align-items:center; gap:8px; overflow-x:auto; padding:8px 10px; background:#7a5733;
    box-shadow:inset 0 3px 6px rgba(0,0,0,.22); -webkit-overflow-scrolling:touch; height:86px; box-sizing:border-box; flex:none; }
  #seedbar::-webkit-scrollbar{ height:0; }
  .seedchip{ flex:none; display:flex; flex-direction:column; align-items:center; gap:1px; padding:4px 7px;
    border-radius:12px; border:2px solid var(--line); background:var(--panel); cursor:pointer; box-shadow:0 3px 0 #b78c4f; }
  .seedchip:active{ transform:translateY(2px); box-shadow:0 1px 0 #b78c4f; }
  .seedchip.active{ border-color:#ffd84d; box-shadow:0 0 0 2px #ffd84d, 0 3px 0 #b78c4f; background:#fffbe9; }
  .seedchip canvas{ width:34px; height:34px; image-rendering:pixelated; }
  .seedchip .nm{ font-size:9px; font-weight:800; color:#7a5326; line-height:1; }
  .seedchip .cnt{ font-size:11px; font-weight:900; color:#3a8fce; line-height:1; }
  .seedbar-empty{ color:#ffe9c0; font-size:12px; font-weight:700; padding:6px 4px; white-space:nowrap; }

  #controls{ display:flex; align-items:flex-end; justify-content:space-between;
    padding:10px 18px calc(14px + env(safe-area-inset-bottom)); gap:10px;
    background:linear-gradient(180deg,#7a5733,var(--bar)); box-shadow:0 -3px 0 #50341d; }
  #dpad{ position:relative; width:150px; height:150px; flex:none; }
  .dbtn{ position:absolute; width:50px; height:50px; border:2px solid var(--line); color:#7a5326; font-size:22px;
    font-weight:900; border-radius:12px; box-shadow:0 3px 0 #b78c4f; cursor:pointer; display:flex; align-items:center;
    justify-content:center; background:linear-gradient(180deg,#fff7e6,#ecd6a6); }
  .dbtn:active,.dbtn.on{ transform:translateY(2px); box-shadow:0 1px 0 #b78c4f; background:linear-gradient(180deg,#ffe9b8,#e0c184); }
  #bUp{ left:50px; top:0; } #bDown{ left:50px; top:100px; } #bLeft{ left:0; top:50px; } #bRight{ left:100px; top:50px; }
  #dpadMid{ position:absolute; left:50px; top:50px; width:50px; height:50px; background:#00000018; border-radius:10px; }
  #actionBtn{ flex:1; max-width:160px; min-height:84px; border:none; border-radius:20px; font-family:inherit;
    font-size:19px; font-weight:900; color:#fff; cursor:pointer; background:linear-gradient(180deg,#6cc24a,#4d9a2c);
    box-shadow:0 5px 0 #3a7720; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  #actionBtn:active{ transform:translateY(3px); box-shadow:0 2px 0 #3a7720; }
  #actionBtn.dim{ background:linear-gradient(180deg,#b9b0a0,#938b7c); box-shadow:0 5px 0 #6f6859; }
  #actionBtn .ico{ font-size:24px; line-height:1; } #actionBtn .lbl{ font-size:14px; }

  #overlay{ position:fixed; inset:0; background:rgba(40,25,10,.5); display:none; align-items:flex-end; justify-content:center; z-index:20; }
  #overlay.show{ display:flex; }
  .sheet{ width:100%; max-width:520px; background:var(--panel); border-radius:22px 22px 0 0;
    padding:18px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px rgba(0,0,0,.3);
    animation:slideUp .22s ease; border-top:4px solid var(--line); max-height:82vh; overflow-y:auto; }
  @keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
  .sheet h2{ margin:2px 0 10px; font-size:20px; text-align:center; color:#7a5326; }
  .sectionTtl{ font-size:13px; font-weight:800; color:#9a7b4a; margin:14px 4px 8px; }
  .item{ display:flex; align-items:center; gap:12px; padding:10px; background:#fff; border:2px solid var(--line);
    border-radius:14px; margin-bottom:10px; box-shadow:inset 0 -3px 0 #f0e2bf; }
  .item canvas{ width:44px; height:44px; image-rendering:pixelated; background:#bfe89a; border-radius:8px; flex:none; }
  .item .ico{ width:44px; height:44px; flex:none; display:flex; align-items:center; justify-content:center; font-size:30px; background:#e6f3d6; border-radius:8px; }
  .item .info{ flex:1; min-width:0; } .item .nm{ font-weight:800; font-size:15px; }
  .item .sub{ font-size:11px; color:#9a7b4a; line-height:1.4; } .item .own{ font-size:11px; color:#3a8fce; font-weight:700; }
  .item .act{ flex:none; border:none; border-radius:10px; padding:10px 14px; font-weight:800; font-size:14px; color:#fff;
    cursor:pointer; font-family:inherit; background:linear-gradient(180deg,#6cc24a,#4d9a2c); box-shadow:0 3px 0 #3a7720; }
  .item .act:active{ transform:translateY(2px); box-shadow:0 1px 0 #3a7720; }
  .item .act:disabled{ background:#cbb88f; box-shadow:0 3px 0 #a89564; opacity:.7; }
  .item .act.buyx{ background:linear-gradient(180deg,#f0a93a,#d4861a); box-shadow:0 3px 0 #b06d12; }
  .closeBtn{ width:100%; margin-top:6px; padding:13px; border:none; border-radius:14px; background:#e7cf9a;
    color:#6b4a2b; font-weight:800; font-size:15px; font-family:inherit; cursor:pointer; }
  .resetBtn{ width:100%; margin-top:10px; padding:11px; border:none; border-radius:12px; background:#f4d6d6;
    color:#b5483f; font-weight:700; font-size:13px; font-family:inherit; cursor:pointer; }
  .saveNote{ text-align:center; font-size:11px; color:#9a7b4a; margin-top:10px; }

  #morning{ position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 38%, rgba(255,236,170,.96), rgba(255,210,120,.96)); }
  #morning.show{ display:flex; animation:fade .3s; } @keyframes fade{ from{opacity:0} to{opacity:1} }
  .mcard{ text-align:center; padding:24px; } .mcard .sun{ font-size:64px; }
  .mcard .d{ font-size:34px; font-weight:900; color:#a85f17; margin:6px 0; text-shadow:0 2px 0 #fff6; }
  .mcard .earn{ font-size:17px; font-weight:800; color:#3a7720; margin:8px 0 18px; min-height:22px; }
  .mcard .go{ border:none; border-radius:16px; padding:14px 40px; font-size:18px; font-weight:900; color:#fff;
    background:linear-gradient(180deg,#ffb13d,#f0931a); box-shadow:0 5px 0 #c4761a; font-family:inherit; cursor:pointer; }
  .mcard .go:active{ transform:translateY(3px); box-shadow:0 2px 0 #c4761a; }

  #toast{ position:fixed; left:50%; bottom:200px; transform:translateX(-50%) translateY(20px); background:#3a2a18ee;
    color:#fff; padding:10px 18px; border-radius:20px; font-size:14px; font-weight:700; opacity:0; pointer-events:none;
    transition:.25s; z-index:40; max-width:90%; text-align:center; }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .floater{ position:fixed; transform:translate(-50%,-50%); font-weight:900; font-size:17px; pointer-events:none;
    z-index:50; text-shadow:0 2px 0 #fff,0 0 5px #fff; animation:floatUp 1.1s ease-out forwards; }
  @keyframes floatUp{ 0%{opacity:0;transform:translate(-50%,-50%) scale(.5);} 18%{opacity:1;transform:translate(-50%,-95%) scale(1.15);} 100%{opacity:0;transform:translate(-50%,-210%) scale(1);} }
  .particle{ position:fixed; width:7px; height:7px; border-radius:2px; transform:translate(-50%,-50%); pointer-events:none;
    z-index:49; animation:spark .66s ease-out forwards; }
  @keyframes spark{ 0%{opacity:1;transform:translate(-50%,-50%) scale(1);} 100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.3);} }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="stat"><span class="lbl">DAY</span><span class="val" id="dayVal">1</span></div>
    <div class="stat"><span class="lbl">💰 おかね</span><span class="val" id="moneyVal">500</span></div>
    <div class="stat"><span class="lbl">⚡ たいりょく</span><span class="val" id="staminaVal">10</span>
      <div id="staminaBarWrap"><div id="staminaBar"></div></div></div>
    <div class="stat"><span class="lbl">⭐ Lv</span><span class="val" id="levelVal">1</span>
      <div id="expBarWrap"><div id="expBar"></div></div></div>
  </div>

  <div id="stage">
    <div id="loadMsg">🌱 牧場を読み込み中…</div>
    <div id="speech"></div>
    <button id="muteBtn" aria-label="音">🔊</button>
  </div>

  <div id="seedbar"></div>

  <div id="controls">
    <div id="dpad">
      <button class="dbtn" id="bUp">▲</button>
      <button class="dbtn" id="bLeft">◀</button>
      <div id="dpadMid"></div>
      <button class="dbtn" id="bRight">▶</button>
      <button class="dbtn" id="bDown">▼</button>
    </div>
    <button id="actionBtn"><span class="ico">✋</span><span class="lbl">—</span></button>
  </div>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="morning"><div class="mcard"><div class="sun">🌅</div><div class="d" id="mDay">Day 2</div>
  <div class="earn" id="mEarn"></div><button class="go" id="mGo">おはよう！</button></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script>
"use strict";

/* ===================== 効果音 ===================== */
const SFX=(function(){
  let ctx=null, muted=(localStorage.getItem("farmgame_muted")==="1");
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;} } if(ctx.state==="suspended")ctx.resume(); return ctx; }
  function tone(f,dur,type,vol,when,slideTo){ const c=ac(); if(!c||muted)return; const t0=c.currentTime+(when||0);
    const o=c.createOscillator(),g=c.createGain(); o.type=type||"sine"; o.frequency.setValueAtTime(f,t0);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
    g.gain.setValueAtTime(0.0001,t0); g.gain.linearRampToValueAtTime(vol,t0+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g).connect(c.destination); o.start(t0); o.stop(t0+dur+0.03); }
  function noise(dur,vol,when,hp){ const c=ac(); if(!c||muted)return; const t0=c.currentTime+(when||0);
    const buf=c.createBuffer(1,Math.max(1,c.sampleRate*dur),c.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; const n=c.createBufferSource(); n.buffer=buf;
    const g=c.createGain(); g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    let node=n; if(hp){const f=c.createBiquadFilter();f.type="highpass";f.frequency.value=hp;node.connect(f);node=f;}
    node.connect(g).connect(c.destination); n.start(t0); n.stop(t0+dur+0.03); }
  const arp=(ns,st,ty,v)=>ns.forEach((f,i)=>tone(f,0.16,ty||"triangle",v||0.16,i*(st||0.06)));
  return { unlock(){ac();}, setMuted(m){muted=m;localStorage.setItem("farmgame_muted",m?"1":"0");}, isMuted(){return muted;},
    till(){noise(0.18,0.22,0,700);tone(150,0.18,"sawtooth",0.1,0,90);},
    plant(){tone(520,0.12,"triangle",0.18,0,700);},
    water(){tone(900,0.1,"sine",0.12,0,1300);tone(700,0.1,"sine",0.1,0.08,1100);noise(0.1,0.04,0,2500);},
    harvest(){arp([523,659,784,1047],0.06,"triangle",0.16);},
    coin(){tone(988,0.08,"square",0.13,0);tone(1319,0.12,"square",0.13,0.07);},
    buy(){tone(740,0.08,"square",0.13,0);tone(988,0.1,"square",0.12,0.06);},
    expand(){arp([392,523,659,784,1047],0.07,"triangle",0.16);},
    sleep(){tone(330,0.6,"sine",0.16,0,150);}, morning(){arp([659,784,988,1319],0.12,"triangle",0.16);},
    step(){tone(180,0.05,"square",0.04);}, error(){tone(200,0.18,"square",0.11,0,140);} };
})();
window.addEventListener("pointerdown",()=>SFX.unlock(),{once:true});

/* ===================== データ ===================== */
const SAVE_KEY="farmgame_save_v3";
const COST={ TILL:2, PLANT:1, WATER:1, HARVEST:1 };
const CROPS={
  turnip:{name:"カブ",seed:50,days:2,sell:120,leaf:"#5fbf4f",fruit:"#f3f1ea",fruit2:"#bb74e0"},
  potato:{name:"じゃがいも",seed:70,days:3,sell:180,leaf:"#4f9a3a",fruit:"#c08a4a",fruit2:"#e0b878"},
  tomato:{name:"トマト",seed:80,days:3,sell:200,leaf:"#4fa83a",fruit:"#e8473f",fruit2:"#ff7a6e"},
  strawberry:{name:"いちご",seed:150,days:4,sell:360,leaf:"#4f9a3a",fruit:"#e8473f",fruit2:"#ffffff"},
  corn:{name:"トウモロコシ",seed:120,days:5,sell:400,leaf:"#6cbf3a",fruit:"#f5d23b",fruit2:"#e8a92b"},
  watermelon:{name:"すいか",seed:300,days:6,sell:780,leaf:"#5aa83a",fruit:"#46b85a",fruit2:"#2f7d3c"},
};
const CROP_IDS=["turnip","potato","tomato","strawberry","corn","watermelon"];
const EXPANSIONS=[ {cols:6,rows:4,cost:1000}, {cols:6,rows:6,cost:3000} ];
const CHICKEN_COST=800, EGG_SELL=80, MAX_CHICKENS=6;
const COW_COST=2500, MILK_SELL=150, MAX_COWS=4, FEED_COST=25;
const FAIRY_DAY=5, FAIRY_HOME={x:5*16+8,y:5*16+2};
const GIFTS=[ {key:"candy",name:"あめ",emoji:"🍬",cost:50,aff:3},
  {key:"flower",name:"おはな",emoji:"💐",cost:150,aff:8},
  {key:"jewel",name:"ほうせき",emoji:"💎",cost:500,aff:25} ];
// ホストクラブ（夜の街）
const HOST_NAME="レオ";
const HOST_RANKS=[ {min:0,name:"初回",emoji:"🌱"}, {min:3000,name:"担当",emoji:"💕"},
  {min:15000,name:"本指名",emoji:"⭐"}, {min:50000,name:"姫",emoji:"👑"} ];
function hostRank(s){ let r=HOST_RANKS[0]; for(const x of HOST_RANKS)if(s>=x.min)r=x; return r; }
const HOST_GIFTS=[ {key:"drink",name:"ドリンク",emoji:"🥃",cost:300},
  {key:"champ",name:"シャンパン",emoji:"🍾",cost:1000},
  {key:"tower",name:"シャンパンタワー",emoji:"🗼",cost:5000} ];
const HOST_LINES=["今日も会いに来てくれたんだ、うれしいよ♡","畑がんばってるんだってね、えらい姫だ✨",
  "会えない日も君のこと考えてたよ？…なんてね♪","次はどこまで突き抜けちゃう？😏","君のためにシャンパン冷やしといたよ🍾",
  "推されると照れるな…ありがと♡","おかえり。今日はどんな一日だった？"];
const HOST_REACT={ drink:["かんぱ〜い🥃 ありがと姫♡","その一杯、効くわ〜✨"],
  champ:["シャンパンいただきます🍾✨","パンッ！最高の音でしょ♡","君がナンバーワンだよ"],
  tower:["タワーきたーー🗼🍾✨ 君は伝説だよ！！","店中ざわついてる…さすが姫♡","一生ついていきます！！"] };
// 動物のおとしもの＆加工品（倉庫アイテム）
const PRODUCTS={
  egg:{name:"たまご",emoji:"🥚",sell:EGG_SELL},
  milk:{name:"牛乳",emoji:"🥛",sell:MILK_SELL},
  omelet:{name:"オムレツ",emoji:"🍳",sell:220},
  cheese:{name:"チーズ",emoji:"🧀",sell:360},
  butter:{name:"バター",emoji:"🧈",sell:300},
  pudding:{name:"プリン",emoji:"🍮",sell:560},
  cake:{name:"ケーキ",emoji:"🎂",sell:980},
};
// 加工レシピ（材料は倉庫から消費、翌朝に完成して倉庫へ）
const RECIPES=[
  {key:"omelet", out:"omelet", emoji:"🍳", name:"オムレツ", need:{egg:1}},
  {key:"cheese", out:"cheese", emoji:"🧀", name:"チーズ", need:{milk:1}},
  {key:"butter", out:"butter", emoji:"🧈", name:"バター", need:{milk:1}},
  {key:"pudding",out:"pudding",emoji:"🍮", name:"プリン", need:{egg:1,milk:1}},
  {key:"cake",   out:"cake",   emoji:"🎂", name:"ケーキ", need:{egg:2,milk:1}},
];
function prodInfo(id){ if(CROPS[id])return {name:CROPS[id].name,sell:CROPS[id].sell};
  if(PRODUCTS[id])return {name:PRODUCTS[id].name,sell:PRODUCTS[id].sell}; return {name:id,sell:0}; }
const LINES_MORNING=["おはよ〜！今日もキラキラいくよ🎀","ふぁ〜あ…よく寝た♪ さ、かせぐわよ💖","今日もせっせと働いて、夜は推しに会いに行くの✨"];
const LINES_HARVEST=["売れたら推しにシャンパン入れちゃう？🍾 なんてね♡","この子たち立派に育って…えらいぞ〜♪","畑ひろげて伝説の太客になるんだから✨","もうひと稼ぎして、今日は同伴いけるかな…!?"];
const LINES_BROKE=["おかねが無い…これじゃ会いに行けないよ〜😭","種代も無いなんて…まずは収穫しなきゃ💦"];

function newTile(){ return {state:"empty",crop:null,growth:0,watered:false}; }
function freshGame(){ return { day:1,money:500,stamina:15,maxStamina:15,level:1,exp:0,cols:4,rows:4,
  seeds:Object.fromEntries(CROP_IDS.map(c=>[c,0])), tiles:Array.from({length:16},newTile), shipping:[], animals:[], drops:[],
  storage:{}, feed:0, cooking:[], fairy:{appeared:false,greeted:false,affection:0}, host:{spent:0,lineDay:0,line:""} }; }
let game=loadGame()||freshGame();
let activeSeed=null;

function saveGame(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(game));}catch(e){} }
function loadGame(){ try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw)return null; const g=JSON.parse(raw);
  CROP_IDS.forEach(c=>{ if(g.seeds[c]==null)g.seeds[c]=0; }); if(!g.cols)g.cols=4; if(!g.rows)g.rows=4;
  if(g.level==null)g.level=1; if(g.exp==null)g.exp=0; g.maxStamina=14+g.level; if(g.stamina>g.maxStamina)g.stamina=g.maxStamina;
  if(!Array.isArray(g.tiles))g.tiles=Array.from({length:16},newTile); while(g.tiles.length<g.cols*g.rows)g.tiles.push(newTile());
  if(!Array.isArray(g.shipping))g.shipping=[]; if(!Array.isArray(g.animals))g.animals=[];

/* ===================== マップ定義 ===================== */
const TS=16, MAP_W=18, MAP_H=13, FARM_X=6, FARM_Y=6;
const HOUSE={x:2,y:2,w:3,h:2,trig:{x:3,y:4}};
const SHOP ={x:13,y:2,w:3,h:2,trig:{x:14,y:4}};
const ANIMAL_SHOP={x:13,y:10,w:3,h:2,trig:{x:14,y:9}};
const KITCHEN={x:7,y:2,w:3,h:2,trig:{x:8,y:4}};      // 加工小屋
const HOST_CLUB={x:10,y:2,w:3,h:2,trig:{x:11,y:4}};  // ホストクラブ（夜の街への入口）
const PASTURE={x0:12,y0:6,x1:16,y1:8};               // ニワトリの放牧エリア（タイル範囲）
function inPasture(tx,ty){ return tx>=PASTURE.x0&&tx<=PASTURE.x1&&ty>=PASTURE.y0&&ty<=PASTURE.y1; }
const POND=[[2,9],[3,9],[2,10],[3,10]];
const TREES=[[5,3],[16,2],[2,7],[3,8]];
const PATH=new Set(); for(let x=3;x<=14;x++)PATH.add(x+",5"); PATH.add("3,4"); PATH.add("14,4");
function isSolidTile(tx,ty){ if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)return true;
  if(tx===0||ty===0||tx===MAP_W-1||ty===MAP_H-1)return true;
  if(tx>=HOUSE.x&&tx<HOUSE.x+HOUSE.w&&ty>=HOUSE.y&&ty<HOUSE.y+HOUSE.h)return true;
  if(tx>=SHOP.x&&tx<SHOP.x+SHOP.w&&ty>=SHOP.y&&ty<SHOP.y+SHOP.h)return true;
  if(tx>=ANIMAL_SHOP.x&&tx<ANIMAL_SHOP.x+ANIMAL_SHOP.w&&ty>=ANIMAL_SHOP.y&&ty<ANIMAL_SHOP.y+ANIMAL_SHOP.h)return true;
  if(tx>=KITCHEN.x&&tx<KITCHEN.x+KITCHEN.w&&ty>=KITCHEN.y&&ty<KITCHEN.y+KITCHEN.h)return true;
  if(tx>=HOST_CLUB.x&&tx<HOST_CLUB.x+HOST_CLUB.w&&ty>=HOST_CLUB.y&&ty<HOST_CLUB.y+HOST_CLUB.h)return true;
  if(POND.some(([x,y])=>x===tx&&y===ty))return true;
  if(TREES.some(([x,y])=>x===tx&&y===ty))return true; return false; }
function plotIndex(tx,ty){ if(tx>=FARM_X&&tx<FARM_X+game.cols&&ty>=FARM_Y&&ty<FARM_Y+game.rows)return (ty-FARM_Y)*game.cols+(tx-FARM_X); return -1; }
function plotWorld(idx){ const c=idx%game.cols,r=Math.floor(idx/game.cols); return {tx:FARM_X+c,ty:FARM_Y+r}; }

    this.hl=this.add.graphics().setDepth(99999);
    // 演出用
    this.add.particles(0,0,"spark",{emitting:false}); // 予熱
  }
  applyZoom(){ const h=this.scale.gameSize.height||this.cameras.main.height; const z=Math.max(1.7,h/(10.5*TS)); this.cameras.main.setZoom(z); }
  genTextures(){ const add=(k,w,h,fn)=>{ if(this.textures.exists(k))this.textures.remove(k); this.textures.addCanvas(k,mkCanvas(w,h,fn)); };
    add("grassA",16,16,x=>drawGroundC(x,0)); add("grassB",16,16,x=>drawGroundC(x,1)); add("path",16,16,drawPathC);
    add("empty",16,16,drawEmptyC); add("soilDry",16,16,x=>drawSoilC(x,false)); add("soilWet",16,16,x=>drawSoilC(x,true));
    CROP_IDS.forEach(c=>{ for(let s=0;s<3;s++) add("crop_"+c+"_"+s,16,16,x=>drawPlantC(x,c,s)); });
    add("tree",16,32,drawTreeC); add("pond",16,16,drawPondC); add("fence",16,16,drawFenceC);
    add("house",48,40,drawHouseC); add("shop",48,40,drawShopC); add("animalshop",48,40,drawAnimalShopC);
    add("coop",16,16,drawCoopGroundC); add("egg",16,16,drawEggC); add("milk",16,16,drawMilkC);
    add("kitchen",48,40,drawKitchenC); add("hostclub",48,40,drawHostClubC);
    add("chicken_0",16,16,x=>drawChickenC(x,0)); add("chicken_1",16,16,x=>drawChickenC(x,1));
    add("cow_0",22,16,x=>drawCowC(x,0)); add("cow_1",22,16,x=>drawCowC(x,1));
    add("fairy_0",16,16,x=>drawFairyC(x,0)); add("fairy_1",16,16,x=>drawFairyC(x,1));
    ["down","up","left","right"].forEach(d=>{ for(let f=0;f<2;f++) add("p_"+d+"_"+f,16,18,x=>drawPlayerC(x,d,f)); });
    add("spark",4,4,x=>{ x.fillStyle="#fff"; x.fillRect(0,0,4,4); });
  }
  buildPlots(){ this.plotLayer.removeAll(true); this.plots=[];
    for(let i=0;i<game.tiles.length;i++){ const w=plotWorld(i);
      const bg=this.add.image(w.tx*TS,w.ty*TS,"empty").setOrigin(0).setDepth(1);
      const cr=this.add.image(w.tx*TS,w.ty*TS,"crop_turnip_0").setOrigin(0).setDepth((w.ty+1)*TS).setVisible(false);
      this.plotLayer.add(bg); this.plotLayer.add(cr); this.plots.push({bg,cr}); this.updatePlot(i); } }
  updatePlot(i){ const t=game.tiles[i], pl=this.plots[i]; if(!pl)return;
    if(t.state==="empty"){ pl.bg.setTexture("empty"); pl.cr.setVisible(false); return; }
    pl.bg.setTexture(t.watered?"soilWet":"soilDry");
    if(t.state==="planted"){ const r=t.growth/CROPS[t.crop].days; const s=r<0.45?0:(r<1?1:2);
      pl.cr.setTexture("crop_"+t.crop+"_"+s).setVisible(true); } else pl.cr.setVisible(false); }
  refreshAllPlots(){ for(let i=0;i<this.plots.length;i++)this.updatePlot(i); }
  buildAnimals(){ (this.animalSprs||[]).forEach(c=>c.spr.destroy()); this.animalSprs=[];
    game.animals.forEach(o=>this.addAnimal(o)); this.refreshDrops(); }
  addAnimal(obj){ const spr=this.add.image(obj.x,obj.y,(obj.type==="cow"?"cow_0":"chicken_0")).setOrigin(0.5,0.85).setDepth(obj.y);
    this.animalSprs.push({obj,spr,vx:0,vy:0,t:Math.random()*2}); }
  refreshDrops(){ (this.eggSprites||[]).forEach(s=>s.destroy()); this.eggSprites=[];
    game.drops.forEach(d=>{ const s=this.add.image(d.tx*TS,d.ty*TS,(d.kind==="milk"?"milk":"egg")).setOrigin(0).setDepth(d.ty*TS+TS); this.eggSprites.push(s); }); }
  buildFairy(){ if(this.fairySpr){ this.fairySpr.destroy(); this.fairySpr=null; this.fairyX=this.fairyY=null; }
    this.fairyBusy=false;
    if(game.fairy&&game.fairy.appeared){ this.fairySpr=this.add.image(FAIRY_HOME.x,FAIRY_HOME.y,"fairy_0").setOrigin(0.5,0.7).setDepth(99990); } }
  // 朝、好感度に応じて畑をふわーっと飛び回って水やり（やらない日は何もしない）
  morningFairyWater(){ if(!this.fairySpr||!game.fairy.appeared||this.fairyBusy)return;
    const p=0.15+0.85*(game.fairy.affection/100), targets=[];
    for(let i=0;i<game.tiles.length;i++){ const t=game.tiles[i];
      if(t.state==="planted"&&!t.watered&&Math.random()<p)targets.push(i); }
    if(!targets.length)return;                    // サボり／仕事なし → なにもしない
    this.fairyBusy=true; let k=0;
    const step=()=>{
      if(k>=targets.length){ this.tweens.add({targets:this.fairySpr,x:FAIRY_HOME.x,y:FAIRY_HOME.y,duration:520,ease:"Sine.inOut",
          onComplete:()=>{ this.fairyBusy=false; }});
        setSpeech(pick(["お水やり、おわり〜💧✨","ぜんぶあげたよ♪","えへへ、がんばった🌱"]),2200); saveGame(); return; }
      const idx=targets[k++], w=plotWorld(idx);
      this.tweens.add({targets:this.fairySpr,x:w.tx*TS+8,y:w.ty*TS+4,duration:300,ease:"Sine.inOut",
        onComplete:()=>{ game.tiles[idx].watered=true; this.updatePlot(idx); SFX.water();
          this.fxBurst(w.tx,w.ty,["#9fd0ff","#5cb6e8","#cdeaff","#ffffff"]); this.time.delayedCall(150,step); }}); };
    step(); }
  wanderAnimals(time,dt){ const x0=PASTURE.x0*TS+4, x1=(PASTURE.x1+1)*TS-4, y0=PASTURE.y0*TS+5, y1=(PASTURE.y1+1)*TS-3;
    this.animalSprs.forEach(ch=>{ const cow=ch.obj.type==="cow"; ch.t-=dt; if(ch.t<=0){ ch.t=(cow?1.4:0.8)+Math.random()*1.8;
      if(Math.random()<(cow?0.6:0.45)){ ch.vx=0; ch.vy=0; } else { const a=Math.random()*6.283, sp=cow?5:9; ch.vx=Math.cos(a)*sp; ch.vy=Math.sin(a)*sp; } }
      let nx=ch.obj.x+ch.vx*dt, ny=ch.obj.y+ch.vy*dt;
      if(nx<x0||nx>x1)ch.vx*=-1; if(ny<y0||ny>y1)ch.vy*=-1;
      ch.obj.x=Math.max(x0,Math.min(x1,nx)); ch.obj.y=Math.max(y0,Math.min(y1,ny));
      const mv=(ch.vx||ch.vy), fr=Math.floor(time/(cow?260:180))%2;
      ch.spr.setTexture((cow?"cow_":"chicken_")+(mv&&fr?1:0));
      ch.spr.setPosition(ch.obj.x,ch.obj.y).setDepth(ch.obj.y); }); }
  fxBurst(tx,ty,colors){ const x=tx*TS+8,y=ty*TS+8;
    const e=this.add.particles(x,y,"spark",{ speed:{min:25,max:95}, lifespan:560, scale:{start:1.3,end:0},
      gravityY:60, quantity:10, tint:colors.map(c=>Phaser.Display.Color.HexStringToColor(c).color), emitting:false });
    e.setDepth(99998); e.explode(11); this.time.delayedCall(700,()=>e.destroy()); }
  fxFloat(tx,ty,text,color){ const x=tx*TS+8,y=ty*TS;
    const t=this.add.text(x,y,text,{fontFamily:"sans-serif",fontSize:"9px",fontStyle:"bold",color:color||"#fff",stroke:"#ffffff",strokeThickness:2}).setOrigin(0.5,1).setDepth(99999);
    this.tweens.add({targets:t,y:y-15,alpha:0,duration:1000,ease:"Cubic.out",onComplete:()=>t.destroy()}); }
  update(time,delta){ if(!this.player)return; const dt=delta/1000;
    let vx=(held.right?1:0)-(held.left?1:0), vy=(held.down?1:0)-(held.up?1:0);
    const moving=!!(vx||vy); const speed=TS*4.3;
    if(vx&&vy){ const n=Math.SQRT1_2; vx*=n; vy*=n; }
    this.player.body.setVelocity(vx*speed,vy*speed);
    if(vy<0)this.facing="up"; else if(vy>0)this.facing="down"; else if(vx<0)this.facing="left"; else if(vx>0)this.facing="right";
    if(moving){ this.walkT+=dt; this.frame=Math.floor(this.walkT/0.16)%2; this.stepT=(this.stepT||0)+dt; if(this.stepT>0.28){this.stepT=0;SFX.step();} }
    else { this.walkT=0; this.frame=0; }
    this.player.setTexture("p_"+this.facing+"_"+this.frame); this.player.setDepth(this.player.y);
    this.wanderAnimals(time,dt);
    if(this.fairySpr){ this.fairySpr.setTexture(Math.floor(time/120)%2?"fairy_1":"fairy_0");
      if(!this.fairyBusy){ const s=time/1000; const fx=FAIRY_HOME.x+Math.sin(s*1.1)*11, fy=FAIRY_HOME.y+Math.cos(s*0.8)*7;
        this.fairyX=fx; this.fairyY=fy; this.fairySpr.setPosition(fx,fy); }
      else { this.fairyX=this.fairySpr.x; this.fairyY=this.fairySpr.y; } }
    this.updateHighlight(); updateHUD();
  }
  updateHighlight(){ this.hl.clear(); const c=getContext(); if(!c)return;
    if(c.type==="farm"){ const w=plotWorld(c.idx); this.hl.lineStyle(1.4,c.none?0xffffff:0xffe14d,c.none?0.5:1);
      this.hl.strokeRect(w.tx*TS+1,w.ty*TS+1,TS-2,TS-2); return; }
    const t=c.trig||c.mark; if(!t)return; const bob=Math.sin(performance.now()/220)*2;
    this.hl.fillStyle(0xffe14d,1); this.hl.fillTriangle(t.x*TS+8,t.y*TS-2+bob, t.x*TS+3,t.y*TS-9+bob, t.x*TS+13,t.y*TS-9+bob); }
}

/* ===================== アクション文脈 ===================== */
function playerTile(){ if(!GS||!GS.player)return {x:8,y:10}; return {x:Math.floor(GS.player.x/TS), y:Math.floor(GS.player.y/TS)}; }
function frontTile(){ const p=playerTile(); const o={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[GS?GS.facing:"down"]; return {x:p.x+o[0],y:p.y+o[1]}; }
function getContext(){ const p=playerTile();
  if(p.x===HOUSE.trig.x&&p.y===HOUSE.trig.y)return {type:"sleep",ico:"🛌",label:"ねる",trig:HOUSE.trig};
  if(p.x===SHOP.trig.x&&p.y===SHOP.trig.y)return {type:"shop",ico:"🛒",label:"ショップ",trig:SHOP.trig};
  if(p.x===ANIMAL_SHOP.trig.x&&p.y===ANIMAL_SHOP.trig.y)return {type:"animalshop",ico:"🐔",label:"どうぶつ屋",trig:ANIMAL_SHOP.trig};
  if(p.x===KITCHEN.trig.x&&p.y===KITCHEN.trig.y)return {type:"kitchen",ico:"🍳",label:"加工小屋",trig:KITCHEN.trig};
  if(p.x===HOST_CLUB.trig.x&&p.y===HOST_CLUB.trig.y)return {type:"host",ico:"🍾",label:"ホストクラブ",trig:HOST_CLUB.trig};
  if(GS&&game.fairy&&game.fairy.appeared&&GS.fairyX!=null){ const dx=GS.player.x-GS.fairyX, dy=GS.player.y-GS.fairyY;
    if(dx*dx+dy*dy < (1.6*TS)*(1.6*TS))return {type:"fairy",ico:"🧚",label:"プレゼント"}; }
  const f=frontTile();
  const drop=game.drops.find(e=>(e.tx===p.x&&e.ty===p.y)||(e.tx===f.x&&e.ty===f.y));
  if(drop){ const pr=PRODUCTS[drop.kind]||PRODUCTS.egg; return {type:"drop",drop,ico:pr.emoji,label:pr.name+"をひろう",mark:{x:drop.tx,y:drop.ty}}; }
  if(GS&&game.animals.length){ let near=null;
    for(const a of game.animals){ const dx=GS.player.x-a.x, dy=GS.player.y-a.y; if(dx*dx+dy*dy<(1.8*TS)*(1.8*TS)){ near=a; break; } }
    if(near){ const unfed=game.animals.filter(a=>!a.fed).length;
      if(unfed>0)return {type:"feed",ico:"🌾",label:`えさやり(のこり${unfed})`,mark:{x:Math.floor(near.x/TS),y:Math.floor(near.y/TS)}}; } }
  const idx=plotIndex(f.x,f.y);
  if(idx>=0){ const t=game.tiles[idx];
    if(t.state==="empty")return {type:"farm",idx,ico:"⛏",label:"たがやす"};
    if(t.state==="tilled"){ ensureActiveSeed(); if(!activeSeed)return {type:"farm",idx,ico:"🌱",label:"種がない",none:true};
      return {type:"farm",idx,ico:"🌱",label:CROPS[activeSeed].name+"を植える"}; }
    if(t.state==="planted"){ if(t.growth>=CROPS[t.crop].days)return {type:"farm",idx,ico:"✂️",label:"収穫"};
      if(!t.watered)return {type:"farm",idx,ico:"💧",label:"水やり"}; return {type:"farm",idx,ico:"🌿",label:"育ち中",none:true}; } }
  return null; }

/* ===================== アクション処理 ===================== */
function doAction(){ const c=getContext(); if(!c){ toast("近づいてからボタンを押してね"); return; }
  if(c.type==="shop"){ SFX.buy(); openShop(); return; }
  if(c.type==="animalshop"){ SFX.buy(); openAnimalShop(); return; }
  if(c.type==="kitchen"){ SFX.buy(); openKitchen(); return; }
  if(c.type==="host"){ SFX.buy(); openHostClub(); return; }
  if(c.type==="feed"){ feedAnimals(); return; }
  if(c.type==="fairy"){ SFX.plant(); openFairy(); return; }
  if(c.type==="sleep"){ sleep(); return; }
  if(c.type==="drop"){ const i=game.drops.indexOf(c.drop); if(i>=0)game.drops.splice(i,1);
    const k=c.drop.kind; game.storage[k]=(game.storage[k]||0)+1; const pr=PRODUCTS[k]||PRODUCTS.egg;
    SFX.coin(); gainExp(2); GS.fxBurst(c.drop.tx,c.drop.ty,["#fff7e0","#ffe14d","#ffffff"]); GS.fxFloat(c.drop.tx,c.drop.ty,"+1 "+pr.emoji,"#d4861a");
    GS.refreshDrops(); setSpeech(pr.name+"ゲット"+pr.emoji+" 倉庫(🍳)に貯まるよ",1600); saveGame(); return; }
  const idx=c.idx, t=game.tiles[idx], w=plotWorld(idx);
  if(t.state==="empty"){ if(!spend(COST.TILL)){SFX.error();return;} t.state="tilled"; SFX.till(); gainExp(2);
    GS.fxBurst(w.tx,w.ty,["#9a6336","#7d4d29","#c79a5b"]); GS.updatePlot(idx); setSpeech("土をたがやした！種をまこう🌱",1500); saveGame(); }
  else if(t.state==="tilled"){ ensureActiveSeed(); if(!activeSeed){ toast("ショップ(🛒)で種を買ってね"); SFX.error(); return; } plant(idx,activeSeed); }
  else if(t.state==="planted"){
    if(t.growth>=CROPS[t.crop].days){ if(!spend(COST.HARVEST)){SFX.error();return;} game.shipping.push(t.crop);
      Object.assign(t,newTile()); t.state="tilled"; SFX.harvest(); gainExp(4);
      GS.fxBurst(w.tx,w.ty,["#ffe14d","#ff8fc0","#67b23f","#ffffff"]); GS.fxFloat(w.tx,w.ty,"+1 📦","#2f7d2f");
      GS.updatePlot(idx); setSpeech(pick(LINES_HARVEST),2500); saveGame(); }
    else if(!t.watered){ if(!spend(COST.WATER)){SFX.error();return;} t.watered=true; SFX.water(); gainExp(1);
      GS.fxBurst(w.tx,w.ty,["#9fd0ff","#5cb6e8","#cdeaff"]); GS.updatePlot(idx); saveGame(); }
    else toast("もう水やり済み。ねむると育つよ😴"); } }
function plant(idx,crop){ const t=game.tiles[idx];
  if(game.seeds[crop]<=0){ toast("その種がないよ"); SFX.error(); return; }
  if(game.stamina<COST.PLANT){ toast("体力が足りない…ねよう😴"); SFX.error(); return; }
  game.stamina-=COST.PLANT; game.seeds[crop]--; gainExp(1); Object.assign(t,newTile()); t.state="planted"; t.crop=crop;
  SFX.plant(); const w=plotWorld(idx); GS.fxBurst(w.tx,w.ty,["#67b23f","#8cc95e","#4d8a2c"]); GS.updatePlot(idx);
  setSpeech(`${CROPS[crop].name}を植えた！水をあげよう💧`,1800); ensureActiveSeed(); renderSeedBar(); saveGame(); }
function spend(cost){ if(game.stamina<cost){ toast("体力が足りない…ねよう😴"); return false; } game.stamina-=cost; return true; }
function expNeed(L){ return 25+(L-1)*20; }
function gainExp(n){ game.exp+=n; let need=expNeed(game.level);
  while(game.exp>=need){ game.exp-=need; game.level++; game.maxStamina=14+game.level; game.stamina=game.maxStamina; levelUpFx(); need=expNeed(game.level); } }
function levelUpFx(){ SFX.expand(); const p=playerTile(); if(GS){ GS.fxBurst(p.x,p.y,["#ffe14d","#9be84d","#ff8fc0","#ffffff"]);
  GS.fxFloat(p.x,p.y,"⭐Lv"+game.level+" 体力+1","#2f7d2f"); } setSpeech(`レベル${game.level}！最大体力アップ⚡✨`,2600); }
function ensureActiveSeed(){ if(activeSeed&&game.seeds[activeSeed]>0)return; activeSeed=CROP_IDS.find(c=>game.seeds[c]>0)||null; }
function buy(crop){ const cf=CROPS[crop];
  if(game.money<cf.seed){ toast("おかねが足りないよ💸"); SFX.error(); setSpeech(pick(LINES_BROKE),2200); return; }
  game.money-=cf.seed; game.seeds[crop]++; activeSeed=crop; SFX.buy(); openShop(); renderSeedBar(); toast(`${cf.name}の種を買った！`); saveGame(); }
function buyExpansion(i){ const ex=EXPANSIONS[i];
  if(game.money<ex.cost){ toast("おかねが足りないよ💸"); SFX.error(); return; }
  game.money-=ex.cost; game.cols=ex.cols; game.rows=ex.rows; while(game.tiles.length<game.cols*game.rows)game.tiles.push(newTile());
  SFX.expand(); if(GS)GS.buildPlots(); openShop(); toast(`畑をひろげた！ ${ex.cols}×${ex.rows}🌾`); setSpeech("畑がひろくなった〜！✨",2000); saveGame(); }
function buyAnimal(type){ const isCow=type==="cow", cost=isCow?COW_COST:CHICKEN_COST, max=isCow?MAX_COWS:MAX_CHICKENS;
  const cur=game.animals.filter(a=>a.type===type).length;
  if(cur>=max){ toast(isCow?"牛はこれ以上ふやせないよ🐄":"小屋がいっぱいだよ🐔"); return; }
  if(game.money<cost){ toast("おかねが足りないよ💸"); SFX.error(); setSpeech(pick(LINES_BROKE),2200); return; }
  game.money-=cost; const x0=PASTURE.x0*TS+6,x1=(PASTURE.x1+1)*TS-6,y0=PASTURE.y0*TS+6,y1=(PASTURE.y1+1)*TS-4;
  const obj={ type, fed:false, x:x0+Math.random()*(x1-x0), y:y0+Math.random()*(y1-y0) }; game.animals.push(obj); if(GS)GS.addAnimal(obj);
  SFX.buy(); openAnimalShop(); setSpeech(isCow?"牛さんをお迎えした🐄💕 えさをあげてね🌾":"ニワトリをお迎えした🐔💕 えさをあげてね🌾",2600); saveGame(); }
function buyFeed(n){ const cost=FEED_COST*n; if(game.money<cost){ toast("おかねが足りないよ💸"); SFX.error(); return; }
  game.money-=cost; game.feed+=n; SFX.buy(); openAnimalShop(); toast(`えさ×${n}を買った🌾`); saveGame(); }
function feedAnimals(){ const unfed=game.animals.filter(a=>!a.fed);
  if(!unfed.length){ toast("みんな満腹だよ😊"); return; }
  if(game.feed<=0){ toast("えさが無いよ。どうぶつ屋(🐔)で買おう🌾"); SFX.error(); return; }
  let n=0; for(const a of unfed){ if(game.feed<=0)break; a.fed=true; game.feed--; n++;
    if(GS)GS.fxFloat(Math.floor(a.x/TS),Math.floor(a.y/TS),"🌾","#7a9e3a"); }
  SFX.plant(); gainExp(n);
  let msg=`${n}匹にごはん🌾 あした産んでくれるよ♪`; if(game.feed<=0&&game.animals.some(a=>!a.fed))msg="えさ切れ…どうぶつ屋で買い足してね";
  setSpeech(msg,2400); saveGame(); }
function sleep(){ SFX.sleep(); let earn=0; const sold={};
  game.shipping.forEach(c=>{ const info=prodInfo(c); earn+=info.sell; sold[c]=(sold[c]||0)+1; }); game.shipping=[]; game.money+=earn;
  // 成長（前日に水やりされたマス）
  game.tiles.forEach(t=>{ if(t.state==="planted"&&t.watered)t.growth++; t.watered=false; });
  // おとしもの（えさをあげた動物だけ産む）
  game.animals.forEach(a=>{ if(!a.fed)return; const tx=Math.floor(a.x/TS),ty=Math.floor(a.y/TS), kind=a.type==="cow"?"milk":"egg";
    if(!game.drops.some(d=>d.tx===tx&&d.ty===ty))game.drops.push({tx,ty,kind}); a.fed=false; });
  game.day++; game.stamina=game.maxStamina;
  // 加工小屋：完成した加工品を倉庫へ
  let dishes=0; game.cooking=game.cooking.filter(c=>{ if(c.ready<=game.day){ game.storage[c.out]=(game.storage[c.out]||0)+1; dishes++; return false; } return true; });
  if(!game.fairy.appeared && game.day>=FAIRY_DAY){ game.fairy.appeared=true; if(GS)GS.buildFairy(); }
  if(GS){ GS.refreshAllPlots(); GS.refreshDrops(); } saveGame(); showMorning(earn,sold,dishes); }

/* ===================== シート（DOM UI） ===================== */
const overlay=document.getElementById("overlay"), sheet=document.getElementById("sheet");
function closeSheet(){ overlay.classList.remove("show"); }
function drawIcon(cv,crop){ const x=cv.getContext("2d"); x.clearRect(0,0,cv.width,cv.height); x.imageSmoothingEnabled=false;
  const a=mkCanvas(16,16,c=>{ drawSoilC(c,false); drawPlantC(c,crop,2); }); x.drawImage(a,0,0,cv.width,cv.height); }
function openShop(){ let h=`<h2>🛒 ショップ</h2><div class="sectionTtl">🌱 たね</div>`;
  CROP_IDS.forEach(c=>{ const cf=CROPS[c],ok=game.money>=cf.seed;
    h+=`<div class="item"><canvas width="64" height="64" data-icon="${c}"></canvas><div class="info"><div class="nm">${cf.name}</div>
      <div class="sub">種 ${cf.seed}円 ・ ${cf.days}日 ・ 売値 ${cf.sell}円</div><div class="own">手持ち：${game.seeds[c]}こ</div></div>
      <button class="act" data-buy="${c}" ${ok?"":"disabled"}>買う</button></div>`; });
  h+=`<div class="sectionTtl">🌾 畑をひろげる</div>`; const cur=game.cols*game.rows; const next=EXPANSIONS.filter(e=>e.cols*e.rows>cur);
  if(next.length===0) h+=`<div class="item"><div class="ico">🌾</div><div class="info"><div class="nm">最大サイズ！</div><div class="sub">これ以上は広げられないよ</div></div></div>`;
  else next.forEach(ex=>{ const idx=EXPANSIONS.indexOf(ex),ok=game.money>=ex.cost;
    h+=`<div class="item"><div class="ico">🌾</div><div class="info"><div class="nm">${ex.cols}×${ex.rows}（${ex.cols*ex.rows}マス）</div>
      <div class="sub">いまの畑をひろげる</div></div><button class="act buyx" data-expand="${idx}" ${ok?"":"disabled"}>${ex.cost}円</button></div>`; });
  h+=`<button class="closeBtn" data-close>とじる</button><button class="resetBtn" data-reset>🗑 最初からはじめる</button>
    <div class="saveNote">💾 進行はこの端末に自動セーブされています</div>`;
  sheet.innerHTML=h; mountSheet(); overlay.classList.add("show"); }
function openAnimalShop(){ const nc=game.animals.filter(a=>a.type!=="cow").length, nk=game.animals.filter(a=>a.type==="cow").length;
  let h=`<h2>🐔 どうぶつ屋さん</h2><div class="saveNote">🌾 えさをあげた動物だけ、翌朝おとしものを産むよ</div>`;
  h+=`<div class="sectionTtl">🐾 どうぶつ</div>`;
  h+=`<div class="item"><div class="ico">🐔</div><div class="info"><div class="nm">ニワトリ</div>
    <div class="sub">えさ→翌朝たまご🥚（売値 ${EGG_SELL}円）</div><div class="own">飼育中：${nc} / ${MAX_CHICKENS}羽</div></div>
    <button class="act" data-buyanimal="chicken" ${(game.money>=CHICKEN_COST&&nc<MAX_CHICKENS)?"":"disabled"}>${CHICKEN_COST}円</button></div>`;
  h+=`<div class="item"><div class="ico">🐄</div><div class="info"><div class="nm">牛</div>
    <div class="sub">えさ→翌朝ぎゅうにゅう🥛（売値 ${MILK_SELL}円）</div><div class="own">飼育中：${nk} / ${MAX_COWS}頭</div></div>
    <button class="act" data-buyanimal="cow" ${(game.money>=COW_COST&&nk<MAX_COWS)?"":"disabled"}>${COW_COST}円</button></div>`;
  h+=`<div class="sectionTtl">🌾 えさ（手持ち：${game.feed}こ）</div>`;
  h+=`<div class="item"><div class="ico">🌾</div><div class="info"><div class="nm">えさ</div>
    <div class="sub">1匹のごはん1回ぶん</div></div>
    <button class="act" data-buyfeed="1" ${game.money>=FEED_COST?"":"disabled"}>×1 ${FEED_COST}円</button>
    <button class="act buyx" data-buyfeed="10" ${game.money>=FEED_COST*10?"":"disabled"}>×10 ${FEED_COST*10}円</button></div>`;
  h+=`<button class="closeBtn" data-close>とじる</button>`; sheet.innerHTML=h; mountSheet(); overlay.classList.add("show"); }
function openKitchen(){ let h=`<h2>🍳 加工小屋</h2>`;
  if(game.cooking.length) h+=`<div class="saveNote">加工中：${game.cooking.map(c=>PRODUCTS[c.out].emoji).join(" ")}（あした完成🌙）</div>`;
  h+=`<div class="sectionTtl">🍳 つくる（あした完成）</div>`;
  RECIPES.forEach(r=>{ const can=Object.entries(r.need).every(([k,v])=>(game.storage[k]||0)>=v);
    const needTxt=Object.entries(r.need).map(([k,v])=>`${PRODUCTS[k].emoji}${v}`).join("＋");
    h+=`<div class="item"><div class="ico">${r.emoji}</div><div class="info"><div class="nm">${r.name}</div>
      <div class="sub">${needTxt} → 売値 ${PRODUCTS[r.out].sell}円</div></div>
      <button class="act" data-cook="${r.key}" ${can?"":"disabled"}>作る</button></div>`; });
  const items=Object.keys(game.storage).filter(k=>game.storage[k]>0);
  h+=`<div class="sectionTtl">📦 倉庫から売る</div>`;
  if(!items.length) h+=`<div class="saveNote">倉庫はからっぽ。動物のおとしものや加工品がここに貯まるよ</div>`;
  else { items.forEach(k=>{ const pr=PRODUCTS[k]||{name:k,emoji:"📦"};
      h+=`<div class="item"><div class="ico">${pr.emoji||"📦"}</div><div class="info"><div class="nm">${pr.name}</div>
        <div class="sub">売値 ${prodInfo(k).sell}円</div><div class="own">在庫：${game.storage[k]}こ</div></div>
        <button class="act" data-sell="${k}">売る</button></div>`; });
    h+=`<button class="act buyx" data-sellall style="width:calc(100% - 8px);margin:6px 4px">ぜんぶ売る💰</button>`; }
  h+=`<button class="closeBtn" data-close>とじる</button>`; sheet.innerHTML=h; mountSheet(); overlay.classList.add("show"); }
function cookRecipe(key){ const r=RECIPES.find(x=>x.key===key); if(!r)return;
  if(!Object.entries(r.need).every(([k,v])=>(game.storage[k]||0)>=v)){ toast("材料が足りないよ"); SFX.error(); return; }
  Object.entries(r.need).forEach(([k,v])=>{ game.storage[k]-=v; if(game.storage[k]<=0)delete game.storage[k]; });
  game.cooking.push({out:r.out,ready:game.day+1}); SFX.buy();
  setSpeech(`${r.name}を仕込んだ！あした完成だよ${r.emoji}`,2200); openKitchen(); saveGame(); }
function sellStorage(k){ if(!(game.storage[k]>0))return; const s=prodInfo(k).sell; game.money+=s; game.storage[k]--; if(game.storage[k]<=0)delete game.storage[k];
  SFX.coin(); toast(`${prodInfo(k).name}を売った +${s}円`); openKitchen(); saveGame(); }
function sellAllStorage(){ let total=0; Object.keys(game.storage).forEach(k=>{ total+=prodInfo(k).sell*game.storage[k]; });
  if(total<=0)return; game.money+=total; game.storage={}; SFX.coin(); setSpeech(`まとめて出荷〜！💰 +${total.toLocaleString()}円`,2200); openKitchen(); saveGame(); }
function openHostClub(){ const ho=game.host;
  if(ho.lineDay!==game.day){ ho.line=pick(HOST_LINES); ho.lineDay=game.day; saveGame(); }
  const rank=hostRank(ho.spent), idx=HOST_RANKS.indexOf(rank), next=HOST_RANKS[idx+1];
  const prog = next ? `次の「${next.name}」まで あと ${(next.min-ho.spent).toLocaleString()}円💸` : "最高ランク「姫」達成！👑✨";
  let h=`<h2>🍾 ホストクラブ</h2>`;
  h+=`<div class="item"><canvas width="72" height="72" data-host style="image-rendering:pixelated;border-radius:12px;background:#2a1d38;flex:none"></canvas>
    <div class="info"><div class="nm">${HOST_NAME} <span style="color:#ff5fa2">${rank.emoji}${rank.name}</span></div>
    <div class="sub">「${ho.line||HOST_LINES[0]}」</div><div class="own">貢ぎ合計：${ho.spent.toLocaleString()}円</div></div></div>`;
  h+=`<div class="saveNote">${prog}</div><div class="sectionTtl">🥂 貢ぐ</div>`;
  HOST_GIFTS.forEach(g=>{ const ok=game.money>=g.cost;
    h+=`<div class="item"><div class="ico">${g.emoji}</div><div class="info"><div class="nm">${g.name}</div>
      <div class="sub">${g.cost.toLocaleString()}円</div></div>
      <button class="act" data-hostgift="${g.key}" ${ok?"":"disabled"}>貢ぐ</button></div>`; });
  h+=`<button class="closeBtn" data-close>とじる</button>`; sheet.innerHTML=h; mountSheet(); overlay.classList.add("show"); }
function hostGift(key){ const g=HOST_GIFTS.find(x=>x.key===key); if(!g)return;
  if(game.money<g.cost){ toast("おかねが足りないよ💸"); SFX.error(); setSpeech("お金ためてからまた来てね？♡",2200); return; }
  const before=hostRank(game.host.spent); game.money-=g.cost; game.host.spent+=g.cost; SFX.coin();
  const after=hostRank(game.host.spent), p=playerTile();
  if(GS){ GS.fxBurst(p.x,p.y,["#ff5fa2","#ffd84d","#5fd8ff","#ffffff"]); GS.fxFloat(p.x,p.y,"-"+g.cost.toLocaleString()+"円","#ff5fa2"); }
  if(after!==before){ SFX.expand(); if(GS)GS.fxBurst(p.x,p.y,["#ffd84d","#ff5fa2","#ffffff","#5fd8ff"]);
    setSpeech(`${after.emoji} ランクアップ！「${after.name}」になった！🎉`,3200); }
  else setSpeech(pick(HOST_REACT[key]),2400);
  openHostClub(); saveGame(); }
function openFairy(){ const a=game.fairy.affection, hearts=Math.round(a/20), r=a/100;
  let status; if(r<0.25)status="気まぐれ。たま〜にお水あげる程度…💤"; else if(r<0.6)status="ちょっと手伝ってくれる🌱";
  else if(r<1)status="けっこう頼れる！💧"; else status="毎朝ぜんぶ水やり！最高のパートナー✨";
  let h=`<h2>🧚 水やりの妖精</h2>`;
  h+=`<div class="item"><div class="ico">🧚</div><div class="info"><div class="nm">なかよし度 ${"❤️".repeat(hearts)}${"🤍".repeat(5-hearts)}</div>
    <div class="sub">${status}</div><div class="own">好感度 ${a}/100</div></div></div>`;
  h+=`<div class="sectionTtl">🎁 プレゼントする</div>`;
  GIFTS.forEach(g=>{ const ok=game.money>=g.cost;
    h+=`<div class="item"><div class="ico">${g.emoji}</div><div class="info"><div class="nm">${g.name}</div>
      <div class="sub">好感度 +${g.aff}</div></div><button class="act" data-gift="${g.key}" ${ok?"":"disabled"}>${g.cost}円</button></div>`; });
  h+=`<button class="closeBtn" data-close>とじる</button>`; sheet.innerHTML=h; mountSheet(); overlay.classList.add("show"); }
function giveGift(key){ const g=GIFTS.find(x=>x.key===key); if(!g)return;
  if(game.money<g.cost){ toast("おかねが足りないよ💸"); SFX.error(); return; }
  game.money-=g.cost; game.fairy.affection=Math.min(100,game.fairy.affection+g.aff); SFX.coin();
  if(GS&&GS.fairyX!=null){ const tx=Math.floor(GS.fairyX/TS),ty=Math.floor(GS.fairyY/TS);
    GS.fxBurst(tx,ty,["#ff9ed6","#fff6b0","#bfeaff","#ffffff"]); GS.fxFloat(tx,ty,"+"+g.aff+" 💕","#e0559a"); }
  setSpeech(pick(["わ〜ありがと💕 もっとお手伝いするね！","えへへ、うれしい✨","だいすき！お水やりがんばる🌱"]),2200);
  openFairy(); saveGame(); }
function mountSheet(){ sheet.querySelectorAll("canvas[data-icon]").forEach(cv=>drawIcon(cv,cv.dataset.icon));
  sheet.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
  sheet.querySelectorAll("[data-buyanimal]").forEach(b=>b.onclick=()=>buyAnimal(b.dataset.buyanimal));
  sheet.querySelectorAll("[data-buyfeed]").forEach(b=>b.onclick=()=>buyFeed(+b.dataset.buyfeed));
  sheet.querySelectorAll("[data-cook]").forEach(b=>b.onclick=()=>cookRecipe(b.dataset.cook));
  sheet.querySelectorAll("[data-sell]").forEach(b=>b.onclick=()=>sellStorage(b.dataset.sell));
  sheet.querySelectorAll("[data-sellall]").forEach(b=>b.onclick=sellAllStorage);
  sheet.querySelectorAll("canvas[data-host]").forEach(cv=>{ const c=cv.getContext("2d"); c.imageSmoothingEnabled=false;
    const a=mkCanvas(16,16,drawHostC); c.drawImage(a,0,0,cv.width,cv.height); });
  sheet.querySelectorAll("[data-hostgift]").forEach(b=>b.onclick=()=>hostGift(b.dataset.hostgift));
  sheet.querySelectorAll("[data-gift]").forEach(b=>b.onclick=()=>giveGift(b.dataset.gift));
  sheet.querySelectorAll("[data-expand]").forEach(b=>b.onclick=()=>buyExpansion(+b.dataset.expand));
  sheet.querySelectorAll("[data-reset]").forEach(b=>b.onclick=resetGame);
  sheet.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet); }
overlay.addEventListener("click",e=>{ if(e.target===overlay)closeSheet(); });

function showMorning(earn,sold,dishes){ document.getElementById("mDay").textContent="Day "+game.day; const e=document.getElementById("mEarn");
  let html = earn>0 ? `出荷できたよ！<br>${Object.keys(sold).map(c=>`${prodInfo(c).name}×${sold[c]}`).join("・")}<br>💰 +${earn.toLocaleString()}円` : "今日はいい天気！";
  if(dishes>0)html += `<br>🍳 加工品が${dishes}こ完成！`;
  e.innerHTML=html;
  if(earn>0){ SFX.coin(); setTimeout(()=>{ burst(innerWidth/2,innerHeight*0.42,["#ffd14d","#f4b740","#fff4c2"],14); floatText(innerWidth/2,innerHeight*0.42,`+${earn.toLocaleString()}円`,"#d4861a"); },220); }
  document.getElementById("morning").classList.add("show"); }
document.getElementById("mGo").onclick=()=>{ document.getElementById("morning").classList.remove("show"); SFX.morning();
  if(game.fairy.appeared && !game.fairy.greeted){ game.fairy.greeted=true; saveGame();
    setSpeech("水やりの妖精があらわれた✨ 左の広場にいるよ！プレゼントで仲良くなろ🎁",4500); }
  else { setSpeech(pick(LINES_MORNING),2600); if(GS)GS.time.delayedCall(700,()=>GS.morningFairyWater()); } };

/* ===================== HUD・種バー・トースト等 ===================== */
function updateHUD(){ document.getElementById("dayVal").textContent=game.day;
  document.getElementById("moneyVal").textContent=game.money.toLocaleString();
  document.getElementById("staminaVal").textContent=game.stamina;
  document.getElementById("staminaBar").style.width=(game.stamina/game.maxStamina*100)+"%";
  document.getElementById("levelVal").textContent=game.level;
  document.getElementById("expBar").style.width=Math.min(100,game.exp/expNeed(game.level)*100)+"%";
  const c=getContext(); const btn=document.getElementById("actionBtn");
  btn.querySelector(".ico").textContent=c?c.ico:"✋"; btn.querySelector(".lbl").textContent=c?c.label:"—";
  btn.classList.toggle("dim",!c||!!(c&&c.none)); }
function renderSeedBar(){ const bar=document.getElementById("seedbar"); const owned=CROP_IDS.filter(c=>game.seeds[c]>0);
  if(owned.length===0){ bar.innerHTML=`<div class="seedbar-empty">🌱 種を持ってないよ。ショップ(🛒)で買おう！</div>`; return; }
  ensureActiveSeed();
  bar.innerHTML=owned.map(c=>`<button class="seedchip${c===activeSeed?' active':''}" data-seed="${c}">
    <canvas width="48" height="48" data-icon="${c}"></canvas><div class="nm">${CROPS[c].name}</div><div class="cnt">×${game.seeds[c]}</div></button>`).join("");
  bar.querySelectorAll("canvas[data-icon]").forEach(cv=>drawIcon(cv,cv.dataset.icon));
  bar.querySelectorAll("[data-seed]").forEach(b=>b.onclick=()=>{ activeSeed=b.dataset.seed; SFX.unlock(); SFX.plant(); renderSeedBar(); }); }
let toastTimer; function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),1700); }
let speechTimer; function setSpeech(msg,ms){ const el=document.getElementById("speech"); el.textContent=msg; el.classList.add("show");
  clearTimeout(speechTimer); speechTimer=setTimeout(()=>el.classList.remove("show"),ms||2500); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function floatText(x,y,t,c){ const el=document.createElement("div"); el.className="floater"; el.textContent=t;
  el.style.left=x+"px"; el.style.top=y+"px"; if(c)el.style.color=c; document.body.appendChild(el); setTimeout(()=>el.remove(),1150); }
function burst(x,y,cols,n){ n=n||8; for(let k=0;k<n;k++){ const p=document.createElement("div"); p.className="particle";
  const a=Math.random()*6.283,d=16+Math.random()*24; p.style.setProperty("--dx",(Math.cos(a)*d)+"px");
  p.style.setProperty("--dy",(Math.sin(a)*d-10)+"px"); p.style.left=x+"px"; p.style.top=y+"px";
  p.style.background=cols[k%cols.length]; document.body.appendChild(p); setTimeout(()=>p.remove(),700); } }

/* ===================== 入力 ===================== */
function bindDir(id,dir){ const b=document.getElementById(id);
  const on=e=>{ e.preventDefault(); held[dir]=true; b.classList.add("on"); SFX.unlock(); };
  const off=e=>{ if(e)e.preventDefault(); held[dir]=false; b.classList.remove("on"); };
  b.addEventListener("pointerdown",on); b.addEventListener("pointerup",off); b.addEventListener("pointerleave",off); b.addEventListener("pointercancel",off); }
bindDir("bUp","up"); bindDir("bDown","down"); bindDir("bLeft","left"); bindDir("bRight","right");
document.getElementById("actionBtn").addEventListener("click",e=>{ e.preventDefault(); doAction(); });
document.getElementById("muteBtn").onclick=()=>{ SFX.unlock(); SFX.setMuted(!SFX.isMuted());
  document.getElementById("muteBtn").textContent=SFX.isMuted()?"🔇":"🔊"; if(!SFX.isMuted())SFX.coin(); };
document.getElementById("muteBtn").textContent=SFX.isMuted()?"🔇":"🔊";
const KM={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",w:"up",s:"down",a:"left",d:"right"};
addEventListener("keydown",e=>{ if(KM[e.key])held[KM[e.key]]=true; if(e.key===" "||e.key==="Enter")doAction(); });
addEventListener("keyup",e=>{ if(KM[e.key])held[KM[e.key]]=false; });

/* ===================== 起動 ===================== */
function boot(){
  if(!window.Phaser){ document.getElementById("loadMsg").textContent="ゲームエンジン(Phaser)の読み込みに失敗しました。ネット接続を確認して再読み込みしてね🙏"; return; }
  new Phaser.Game({ type:Phaser.AUTO, parent:"stage", pixelArt:true, roundPixels:true, backgroundColor:"#6ea83f",
    physics:{ default:"arcade", arcade:{ debug:false } },
    scale:{ mode:Phaser.Scale.RESIZE, parent:"stage" }, scene:[Farm] });
  renderSeedBar(); updateHUD();
  setSpeech("わたしの牧場へようこそ🎀 十字キーで歩いて、畑に行ってみて！",4200);
}
window.addEventListener("load",boot);
</script>
