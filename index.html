<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#8ec96a" />
<title>ぼくじょう物語 🌱 Step1</title>
<style>
  :root{
    --bar:#6b4a2b;
    --bar2:#8a623c;
    --panel:#fff7e6;
    --panel2:#ffe9b8;
    --line:#c79a5b;
    --green:#67b23f;
    --green-d:#4d8a2c;
    --text:#4a3526;
    --gold:#f4b740;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; }
  body{
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:#9bd76b;
    background-image:
      radial-gradient(circle at 20% 10%, #aee07f 0 12%, transparent 12.5%),
      radial-gradient(circle at 80% 30%, #aee07f 0 10%, transparent 10.5%),
      linear-gradient(180deg,#a9e077,#8ec96a);
    color:var(--text);
    user-select:none; -webkit-user-select:none;
    overscroll-behavior:none; touch-action:manipulation;
    display:flex; flex-direction:column; align-items:center;
    min-height:100%;
  }
  #app{
    width:100%; max-width:480px; min-height:100vh;
    min-height:100dvh;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  /* ===== Top bar ===== */
  #topbar{
    display:flex; gap:8px; padding:10px 12px;
    background:linear-gradient(180deg,var(--bar2),var(--bar));
    box-shadow:0 4px 0 #50341d, 0 5px 10px rgba(0,0,0,.25);
    position:sticky; top:0; z-index:5;
  }
  .stat{
    flex:1; background:var(--panel); border:2px solid var(--line);
    border-radius:12px; padding:6px 6px; text-align:center;
    display:flex; flex-direction:column; gap:2px;
    box-shadow:inset 0 -3px 0 #e7cf9a;
  }
  .stat .lbl{ font-size:10px; color:#9a7b4a; font-weight:700; letter-spacing:.5px; }
  .stat .val{ font-size:18px; font-weight:800; line-height:1; }
  #staminaBarWrap{ height:6px; background:#e7cf9a; border-radius:4px; overflow:hidden; margin-top:3px; }
  #staminaBar{ height:100%; width:100%; background:linear-gradient(90deg,#ffd14d,#ff8a3d); transition:width .3s; }

  /* ===== Field ===== */
  #fieldArea{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:14px 14px 4px;
  }
  #fieldFrame{
    background:linear-gradient(180deg,#b07a44,#8a5a30);
    padding:10px; border-radius:18px;
    box-shadow:0 6px 0 #5f3c1f, 0 10px 18px rgba(0,0,0,.25);
    border:3px solid #6b4628;
  }
  #grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px;
    background:#6b4628; padding:6px; border-radius:10px;
  }
  .tile{
    width:100%; aspect-ratio:1/1; position:relative;
    border-radius:8px; overflow:hidden; cursor:pointer;
    background:#79b84e;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);
    transition:transform .07s;
  }
  .tile:active{ transform:scale(.94); }
  .tile canvas{ width:100%; height:100%; display:block; image-rendering:pixelated; }
  .tile.ready{ animation:bob .9s ease-in-out infinite; box-shadow:inset 0 0 0 3px #ffe14d, 0 0 12px #ffe14d99; }
  .tile .badge{
    position:absolute; top:-2px; right:-2px; font-size:13px;
    filter:drop-shadow(0 1px 0 #00000055);
  }
  @keyframes bob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-3px);} }

  #hint{
    margin-top:10px; font-size:12px; color:#3c6b1f; font-weight:700;
    background:#ffffffbb; padding:5px 12px; border-radius:20px;
    min-height:14px;
  }

  /* ===== Bottom bar ===== */
  #bottombar{
    display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg,var(--bar2),var(--bar));
    box-shadow:0 -4px 0 #50341d;
  }
  .btn{
    flex:1; border:none; border-radius:14px; padding:14px 6px;
    font-size:16px; font-weight:800; color:#fff; cursor:pointer;
    font-family:inherit; display:flex; align-items:center; justify-content:center; gap:6px;
    box-shadow:0 4px 0 rgba(0,0,0,.3); transition:transform .06s, box-shadow .06s;
  }
  .btn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.3); }
  .btn-shop{ background:linear-gradient(180deg,#5cb6e8,#3a8fce); }
  .btn-sleep{ background:linear-gradient(180deg,#9a7bd6,#7253b8); }

  /* ===== Modal / sheet ===== */
  #overlay{
    position:fixed; inset:0; background:rgba(40,25,10,.5);
    display:none; align-items:flex-end; justify-content:center; z-index:20;
  }
  #overlay.show{ display:flex; }
  .sheet{
    width:100%; max-width:480px; background:var(--panel);
    border-radius:22px 22px 0 0; padding:18px 16px calc(20px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 20px rgba(0,0,0,.3);
    animation:slideUp .22s ease;
    border-top:4px solid var(--line);
  }
  @keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
  .sheet h2{ margin:2px 0 14px; font-size:20px; text-align:center; color:#7a5326; }
  .item{
    display:flex; align-items:center; gap:12px; padding:10px;
    background:#fff; border:2px solid var(--line); border-radius:14px; margin-bottom:10px;
    box-shadow:inset 0 -3px 0 #f0e2bf;
  }
  .item canvas{ width:44px; height:44px; image-rendering:pixelated;
    background:#bfe89a; border-radius:8px; flex:none; }
  .item .info{ flex:1; min-width:0; }
  .item .nm{ font-weight:800; font-size:15px; }
  .item .sub{ font-size:11px; color:#9a7b4a; line-height:1.4; }
  .item .own{ font-size:11px; color:#3a8fce; font-weight:700; }
  .item .act{
    flex:none; border:none; border-radius:10px; padding:10px 14px;
    font-weight:800; font-size:14px; color:#fff; cursor:pointer; font-family:inherit;
    background:linear-gradient(180deg,#6cc24a,#4d9a2c); box-shadow:0 3px 0 #3a7720;
  }
  .item .act:active{ transform:translateY(2px); box-shadow:0 1px 0 #3a7720; }
  .item .act:disabled{ background:#cbb88f; box-shadow:0 3px 0 #a89564; opacity:.7; }
  .closeBtn{
    width:100%; margin-top:4px; padding:13px; border:none; border-radius:14px;
    background:#e7cf9a; color:#6b4a2b; font-weight:800; font-size:15px; font-family:inherit; cursor:pointer;
  }

  /* ===== Morning popup ===== */
  #morning{
    position:fixed; inset:0; z-index:30; display:none;
    align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 38%, rgba(255,236,170,.96), rgba(255,210,120,.96));
  }
  #morning.show{ display:flex; animation:fade .3s; }
  @keyframes fade{ from{opacity:0} to{opacity:1} }
  .mcard{ text-align:center; padding:24px; }
  .mcard .sun{ font-size:64px; animation:bob 1.6s ease-in-out infinite; }
  .mcard .d{ font-size:34px; font-weight:900; color:#a85f17; margin:6px 0; text-shadow:0 2px 0 #fff6; }
  .mcard .earn{ font-size:18px; font-weight:800; color:#3a7720; margin:8px 0 18px; min-height:22px;}
  .mcard .go{
    border:none; border-radius:16px; padding:14px 40px; font-size:18px; font-weight:900;
    color:#fff; background:linear-gradient(180deg,#ffb13d,#f0931a); box-shadow:0 5px 0 #c4761a;
    font-family:inherit; cursor:pointer;
  }
  .mcard .go:active{ transform:translateY(3px); box-shadow:0 2px 0 #c4761a; }

  /* ===== Toast ===== */
  #toast{
    position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:#3a2a18ee; color:#fff; padding:10px 18px; border-radius:20px;
    font-size:14px; font-weight:700; opacity:0; pointer-events:none; transition:.25s; z-index:40;
    max-width:90%; text-align:center;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="stat"><span class="lbl">DAY</span><span class="val" id="dayVal">1</span></div>
    <div class="stat"><span class="lbl">💰 おかね</span><span class="val" id="moneyVal">500</span></div>
    <div class="stat">
      <span class="lbl">⚡ たいりょく</span>
      <span class="val" id="staminaVal">10</span>
      <div id="staminaBarWrap"><div id="staminaBar"></div></div>
    </div>
  </div>

  <div id="fieldArea">
    <div id="fieldFrame">
      <div id="grid"></div>
    </div>
    <div id="hint">マスをタップして畑をたがやそう！</div>
  </div>

  <div id="bottombar">
    <button class="btn btn-shop" id="shopBtn">🛒 ショップ</button>
    <button class="btn btn-sleep" id="sleepBtn">🛌 ねる</button>
  </div>
</div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<div id="morning">
  <div class="mcard">
    <div class="sun">🌅</div>
    <div class="d" id="mDay">Day 2</div>
    <div class="earn" id="mEarn"></div>
    <button class="go" id="mGo">おはよう！</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ===================== データ ===================== */
const COST = { TILL:2, PLANT:1, WATER:1, HARVEST:1 };

const CROPS = {
  turnip: { name:"カブ",         seed:50,  days:2, sell:120, leaf:"#5fbf4f", fruit:"#f3f1ea", fruit2:"#bb74e0" },
  tomato: { name:"トマト",       seed:80,  days:3, sell:200, leaf:"#4fa83a", fruit:"#e8473f", fruit2:"#ff7a6e" },
  corn:   { name:"トウモロコシ", seed:120, days:5, sell:400, leaf:"#6cbf3a", fruit:"#f5d23b", fruit2:"#e8a92b" },
};
const CROP_IDS = ["turnip","tomato","corn"];

const game = {
  day:1, money:500, stamina:10, maxStamina:10,
  seeds:{ turnip:0, tomato:0, corn:0 },
  tiles:Array.from({length:16},()=>({ state:"empty", crop:null, growth:0, watered:false })),
  shipping:[],
};

/* ===================== ピクセル描画 ===================== */
// 論理16x16グリッドにドット絵を描く
function mkCanvas(el){
  const c = el; const ctx = c.getContext("2d");
  return { c, ctx, U:c.width/16 };
}
function px(ctx,U,x,y,w,h,col){ ctx.fillStyle=col; ctx.fillRect(x*U,y*U,w*U,h*U); }

function drawGrass(ctx,U){
  px(ctx,U,0,0,16,16,"#79b84e");
  px(ctx,U,0,0,16,16,"#79b84e");
  // ちょっとした草の濃淡
  const spots=[[2,3],[6,11],[11,5],[13,12],[8,2]];
  spots.forEach(([x,y])=>{ px(ctx,U,x,y,1,1,"#67a83e"); px(ctx,U,x,y+1,1,1,"#8cc95e"); });
}
function drawSoil(ctx,U,watered){
  const base = watered ? "#6e4326" : "#9a6336";
  const dark = watered ? "#583320" : "#7d4d29";
  px(ctx,U,0,0,16,16,"#79b84e");          // 周りの草
  px(ctx,U,1,1,14,14,base);                // 土
  // うね
  for(let y=2;y<14;y+=3){ px(ctx,U,2,y,12,1,dark); }
  if(watered){ // 水たまりキラ
    px(ctx,U,4,4,1,1,"#9fd0ff"); px(ctx,U,10,8,1,1,"#9fd0ff"); px(ctx,U,7,11,1,1,"#9fd0ff");
  }
}
// 苗・作物（progress:0..1+, mature時はfruit表示）
function drawPlant(ctx,U,crop,growth){
  const cf=CROPS[crop]; const ratio=growth/cf.days;
  // 茎
  if(ratio<0.45){
    // 芽
    px(ctx,U,7,9,2,4,cf.leaf);
    px(ctx,U,5,9,2,2,cf.leaf);
    px(ctx,U,9,9,2,2,cf.leaf);
  } else if(ratio<1){
    // 生長中
    px(ctx,U,7,6,2,7,"#4d8a2c");
    px(ctx,U,4,7,3,2,cf.leaf); px(ctx,U,9,8,3,2,cf.leaf);
    px(ctx,U,5,5,2,2,cf.leaf); px(ctx,U,9,5,2,2,cf.leaf);
  } else {
    // 収穫OK
    px(ctx,U,7,8,2,5,"#4d8a2c");
    px(ctx,U,4,8,3,2,cf.leaf); px(ctx,U,9,9,3,2,cf.leaf);
    if(crop==="corn"){
      px(ctx,U,6,3,4,6,cf.fruit); px(ctx,U,6,3,4,6,cf.fruit);
      for(let y=4;y<8;y+=2){ px(ctx,U,6,y,4,1,cf.fruit2); }
      px(ctx,U,6,2,2,2,cf.leaf); px(ctx,U,9,3,2,2,cf.leaf);
    } else if(crop==="tomato"){
      px(ctx,U,5,5,3,3,cf.fruit); px(ctx,U,9,4,3,3,cf.fruit);
      px(ctx,U,5,5,1,1,cf.fruit2); px(ctx,U,9,4,1,1,cf.fruit2);
      px(ctx,U,6,4,1,1,cf.leaf); px(ctx,U,10,3,1,1,cf.leaf);
    } else { // turnip
      px(ctx,U,6,7,5,5,cf.fruit);
      px(ctx,U,6,11,5,1,"#d8d4c8");
      px(ctx,U,6,6,2,2,cf.fruit2); px(ctx,U,8,5,2,2,cf.fruit2);
    }
  }
}

function drawTile(canvas,t){
  const {ctx,U}=mkCanvas(canvas);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(t.state==="empty"){ drawGrass(ctx,U); }
  else if(t.state==="tilled"){ drawSoil(ctx,U,t.watered); }
  else if(t.state==="planted"){ drawSoil(ctx,U,t.watered); drawPlant(ctx,U,t.crop,t.growth); }
}
function drawIcon(canvas,crop){
  const {ctx,U}=mkCanvas(canvas);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawSoil(ctx,U,false);
  drawPlant(ctx,U,crop,CROPS[crop].days); // mature見た目
}

/* ===================== UI構築 ===================== */
const grid=document.getElementById("grid");
const tileEls=[];
game.tiles.forEach((t,i)=>{
  const d=document.createElement("div"); d.className="tile";
  const cv=document.createElement("canvas"); cv.width=64; cv.height=64;
  const badge=document.createElement("span"); badge.className="badge";
  d.appendChild(cv); d.appendChild(badge);
  d.addEventListener("click",()=>onTile(i));
  grid.appendChild(d);
  tileEls.push({d,cv,badge});
});

function render(){
  document.getElementById("dayVal").textContent=game.day;
  document.getElementById("moneyVal").textContent=game.money.toLocaleString();
  document.getElementById("staminaVal").textContent=game.stamina;
  document.getElementById("staminaBar").style.width=(game.stamina/game.maxStamina*100)+"%";
  game.tiles.forEach((t,i)=>{
    const el=tileEls[i];
    drawTile(el.cv,t);
    const ready = t.state==="planted" && t.growth>=CROPS[t.crop].days;
    el.d.classList.toggle("ready",ready);
    if(ready) el.badge.textContent="✨";
    else if(t.state==="planted" && t.watered) el.badge.textContent="💧";
    else el.badge.textContent="";
  });
}

/* ===================== ゲーム操作 ===================== */
function onTile(i){
  const t=game.tiles[i];
  if(t.state==="empty"){
    if(!spend(COST.TILL,"たがやす")) return;
    t.state="tilled"; hint("土をたがやした！ 種をまこう 🌱"); render();
  }
  else if(t.state==="tilled"){
    const owned=CROP_IDS.filter(c=>game.seeds[c]>0);
    if(owned.length===0){ toast("種がないよ！ショップで買おう 🛒"); return; }
    openPlant(i);
  }
  else if(t.state==="planted"){
    const ready=t.growth>=CROPS[t.crop].days;
    if(ready){
      if(!spend(COST.HARVEST,"収穫")) return;
      game.shipping.push(t.crop);
      const nm=CROPS[t.crop].name;
      t.state="tilled"; t.crop=null; t.growth=0; t.watered=false;
      hint(`${nm}を収穫！出荷箱へ入れたよ 📦`); render();
    } else if(!t.watered){
      if(!spend(COST.WATER,"水やり")) return;
      t.watered=true; hint("お水をあげた 💧 ねむると成長するよ"); render();
    } else {
      toast("もう水やり済み。ねむると育つよ 😴");
    }
  }
}

function plant(i,crop){
  const t=game.tiles[i];
  if(game.seeds[crop]<=0){ toast("その種がないよ"); return; }
  if(game.stamina<COST.PLANT){ toast("体力が足りない…ねよう 😴"); return; }
  game.stamina-=COST.PLANT; game.seeds[crop]--;
  t.state="planted"; t.crop=crop; t.growth=0; t.watered=false;
  closeSheet(); hint(`${CROPS[crop].name}の種をまいた！水をあげよう 💧`); render();
}

function spend(cost,label){
  if(game.stamina<cost){ toast("体力が足りない…ねよう 😴"); return false; }
  game.stamina-=cost; return true;
}

function buy(crop){
  const cf=CROPS[crop];
  if(game.money<cf.seed){ toast("おかねが足りないよ 💸"); return; }
  game.money-=cf.seed; game.seeds[crop]++;
  render(); openShop(); // 数を更新
  toast(`${cf.name}の種を買った！`);
}

/* ねる → 夜に出荷＆成長 → 朝 */
function sleep(){
  // 出荷箱 → おかね
  let earn=0; const sold={};
  game.shipping.forEach(c=>{ earn+=CROPS[c].sell; sold[c]=(sold[c]||0)+1; });
  game.shipping=[];
  game.money+=earn;
  // 成長（水やりしたものだけ）
  game.tiles.forEach(t=>{
    if(t.state==="planted" && t.watered){ t.growth++; }
    t.watered=false;
  });
  // 翌朝
  game.day++; game.stamina=game.maxStamina;
  render();
  showMorning(earn,sold);
}

/* ===================== シート（ショップ／植える） ===================== */
const overlay=document.getElementById("overlay");
const sheet=document.getElementById("sheet");
function closeSheet(){ overlay.classList.remove("show"); }

function openShop(){
  let html=`<h2>🛒 たねやさん</h2>`;
  CROP_IDS.forEach(c=>{
    const cf=CROPS[c]; const canAfford=game.money>=cf.seed;
    html+=`<div class="item">
      <canvas width="64" height="64" data-icon="${c}"></canvas>
      <div class="info">
        <div class="nm">${cf.name}</div>
        <div class="sub">種 ${cf.seed}円 ・ ${cf.days}日で収穫 ・ 売値 ${cf.sell}円</div>
        <div class="own">手持ちの種：${game.seeds[c]}こ</div>
      </div>
      <button class="act" data-buy="${c}" ${canAfford?"":"disabled"}>買う</button>
    </div>`;
  });
  html+=`<button class="closeBtn" data-close>とじる</button>`;
  sheet.innerHTML=html; mountSheet();
  overlay.classList.add("show");
}

function openPlant(i){
  let html=`<h2>🌱 なにを植える？</h2>`;
  CROP_IDS.forEach(c=>{
    const cf=CROPS[c]; const has=game.seeds[c]>0;
    html+=`<div class="item">
      <canvas width="64" height="64" data-icon="${c}"></canvas>
      <div class="info">
        <div class="nm">${cf.name}</div>
        <div class="sub">${cf.days}日で収穫 ・ 売値 ${cf.sell}円</div>
        <div class="own">手持ちの種：${game.seeds[c]}こ</div>
      </div>
      <button class="act" data-plant="${c}" ${has?"":"disabled"}>植える</button>
    </div>`;
  });
  html+=`<button class="closeBtn" data-close>やめる</button>`;
  sheet.innerHTML=html; mountSheet(i);
  overlay.classList.add("show");
}

function mountSheet(plantIndex){
  sheet.querySelectorAll("canvas[data-icon]").forEach(cv=>drawIcon(cv,cv.dataset.icon));
  sheet.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>buy(b.dataset.buy));
  sheet.querySelectorAll("[data-plant]").forEach(b=>b.onclick=()=>plant(plantIndex,b.dataset.plant));
  sheet.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);
}

/* ===================== 朝の演出 ===================== */
function showMorning(earn,sold){
  document.getElementById("mDay").textContent="Day "+game.day;
  const e=document.getElementById("mEarn");
  if(earn>0){
    const parts=Object.keys(sold).map(c=>`${CROPS[c].name}×${sold[c]}`).join("・");
    e.innerHTML=`出荷できたよ！<br>${parts}<br>💰 +${earn.toLocaleString()}円`;
  } else { e.textContent="今日はいい天気！"; }
  document.getElementById("morning").classList.add("show");
}
document.getElementById("mGo").onclick=()=>{
  document.getElementById("morning").classList.remove("show");
  hint("あたらしい一日のはじまり！");
};

/* ===================== 雑多 ===================== */
let toastTimer;
function toast(msg){
  const el=document.getElementById("toast");
  el.textContent=msg; el.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove("show"),1700);
}
function hint(msg){ document.getElementById("hint").textContent=msg; }

document.getElementById("shopBtn").onclick=openShop;
document.getElementById("sleepBtn").onclick=sleep;
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeSheet(); });

render();
</script>
</body>
</html>
